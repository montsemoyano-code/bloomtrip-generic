:root{--bg:#faf8f5;--card:#fff;--text:#25232a;--muted:#77727d;--line:#e8e2e9;--accent:#7b61a8;--danger:#b94b4b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1050px;margin:auto;padding:20px 16px 50px}h1{margin:0;font-size:30px}.sub{color:var(--muted);margin:4px 0 18px}button,input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff;color:var(--text)}button{cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.danger{color:var(--danger);border-color:#e7caca}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.trips{display:grid;gap:8px}.trip{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px}.trip-main{min-width:0}.trip-name{font-weight:700}.trip-meta{font-size:13px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:6px;flex-wrap:wrap}.profiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.profile{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px;text-align:center;cursor:pointer}.avatar{font-size:38px}.profile b{display:block;margin-top:5px}.pct{color:var(--muted);font-size:13px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}.stat small{display:block;color:var(--muted)}.stat b{font-size:20px}.progress{height:10px;background:#e9e5ea;border-radius:99px;overflow:hidden;margin:10px 0 18px}.bar{height:100%;background:var(--accent);width:0}.filters{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:8px;margin:12px 0}.item{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--lin const SUPABASE_URL="https://aklffkhjvsruxrqvbbqg.supabase.co",SUPABASE_KEY="sb_publishable_eukhXd1rFXuuRBrkfmAVmA_HujBVLOG";$=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));let people=[],trips=[],items=[],categories=[],locations=[],modules=[],currentTrip=null,currentPerson=null,tripPeople=[],undoStack=[];
async function api(path,opts={}){const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...opts,headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",Prefer:opts.method==="POST"?"return=representation":"return=minimal",...(opts.headers||{})}});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}
function openModal(html){$("dialog").innerHTML=html;$("modal").classList.add("open")}function closeModal(){$("modal").classList.remove("open")}$("modal").onclick=e=>{if(e.target===$("modal"))closeModal()};function fmtDate(v){if(!v)return"";return new Date(v+"T00:00:00").toLocaleDateString("es-ES")}function tripMeta(t){const mods=(t._modules||[]).map(x=>x.name).join(", ");return [t.destination,fmtDate(t.start_date)+(t.end_date?" – "+fmtDate(t.end_date):""),t.season,mods].filter(Boolean).join(" · ")}
async function loadBase(){[people,categories,locations,trips,modules]=await Promise.all([api("bloomtrip_people?select=*&active=eq.true&is_default=eq.true&order=sort_order,id"),api("bloomtrip_categories?select=*&active=eq.true&order=sort_order,name"),api("bloomtrip_locations?select=*&active=eq.true&order=sort_order,name"),api("bloomtrip_trips?select=*&status=eq.active&is_template=eq.false&order=created_at.desc"),api("bloomtrip_modules?select=*&active=eq.true&order=sort_order,name")]);const settings=await api("bloomtrip_settings?select=key,value");const s=Object.fromEntries(settings.map(x=>[x.key,x.value]));$("subtitle").textContent=s.app_subtitle||"Tu checklist de viajes";for(const t of trips){t._modules=await api("bloomtrip_trip_modules?trip_id=eq."+t.id+"&select=module_id").then(async links=>{if(!links.length)return[];const ids=links.map(x=>x.module_id).join(",");return modules.filter(m=>ids.split(",").includes(String(m.id)))}).catch(()=>[])} }
async function renderTrips(){await loadBase();const box=$("trips");box.innerHTML="";if(!trips.length){box.innerHTML='<div class="empty">Todavía no hay viajes. Crea el primero.</div>';return}trips.forEach(t=>{const d=document.createElement("div");d.className="trip";d.innerHTML='<div class="trip-main"><div class="trip-name">'+esc(t.name)+'</div><div class="trip-meta">'+esc(tripMeta(t))+'</div></div><div class="actions"><button data-open>Abrir</button><button data-edit>✏️</button><button class="danger" data-del>🗑️</button></div>';d.querySelector("[data-open]").onclick=()=>openTrip(t);d.querySelector("[data-edit]").onclick=()=>tripForm(t);d.querySelector("[data-del]").onclick=()=>deleteTrip(t);box.append(d)})}
function getPetModuleId(){const m=modules.find(x=>(x.name||"").toLowerCase()==="viaje con mascota");return m?Number(m.id):null}function isPetTrip(t){return getPetModuleId()!=null&&(t?._modules||[]).some(m=>Number(m.id)===getPetModuleId())}function isPetTripByModules(ids){const pid=getPetModuleId();return pid!=null&&ids.map(Number).includes(pid)}
function personIsPet(tp){return tp?.person?.kind==="pet"}
function legacyAppliesToPerson(x,tp,general){if(x.assignment_mode!=="all")return false;const pet=personIsPet(tp);if((general?.categoria||x.categoria)==="Mascota") {if(!pet)return false;const targets=(general?.pet_targets||[]).map(v=>String(v).toLowerCase());if(!targets.length)return true;return targets.includes(String(tp.person?.kind||tp.person?.name||"").toLowerCase())||targets.includes(String(tp.person?.name||"").toLowerCase())}return !pet}
async function postTripItemPeople(rows){
  const unique=[];const seen=new Set();
  for(const r of (rows||[])){const k=String(r.trip_item_id)+":"+String(r.person_id);if(seen.has(k))continue;seen.add(k);unique.push(r);}
  if(!unique.length)return [];
  const itemIds=[...new Set(unique.map(r=>Number(r.trip_item_id)).filter(Number.isFinite))];
  const personIds=[...new Set(unique.map(r=>Number(r.person_id)).filter(Number.isFinite))];
  let existing=[];
  if(itemIds.length&&personIds.length){
    existing=await api("bloomtrip_trip_item_people?trip_item_id=in.("+itemIds.join(",")+")&person_id=in.("+personIds.join(",")+")&select=trip_item_id,person_id").catch(()=>[]);
  }
  const have=new Set(existing.map(r=>String(r.trip_item_id)+":"+String(r.person_id)));
  const missing=unique.filter(r=>!have.has(String(r.trip_item_id)+":"+String(r.person_id)));
  if(!missing.length)return existing;
  return api("bloomtrip_trip_item_people",{method:"POST",body:JSON.stringify(missing),headers:{Prefer:"resolution=ignore-duplicates,return=representation"}});
}

async function initTripPeople(t,selectedPetIds=null,selectedTravelerIds=null){
  const petTrip=isPetTrip(t);
  let existing=await api("bloomtrip_trip_people?trip_id=eq."+t.id+"&select=*,person:bloomtrip_people(id,name,kind,emoji)&order=person_id");
  const existingTravelerIds=existing.filter(tp=>tp.person?.kind==="traveler").map(tp=>Number(tp.person_id));
  const travelers=selectedTravelerIds===null?(t._isNew?people.filter(p=>p.kind==="traveler").slice(0,2):people.filter(p=>p.kind==="traveler"&&existingTravelerIds.includes(Number(p.id)))):people.filter(p=>p.kind==="traveler"&&selectedTravelerIds.includes(Number(p.id)));
  const ids=selectedPetIds===null?[...new Set(existing.filter(tp=>tp.person?.kind==="pet").map(tp=>Number(tp.person_id)))]:selectedPetIds.map(Number);
  const wanted=travelers.concat(petTrip?people.filter(p=>p.kind==="pet"&&ids.includes(Number(p.id))):[]);
  const wantedIds=new Set(wanted.map(p=>Number(p.id)));
  const tripItemIds=[...(await api("bloomtrip_trip_items?trip_id=eq."+t.id+"&select=id").catch(()=>[])).map(x=>Number(x.id)).filter(Number.isFinite)];
  const removedPeople=existing.filter(tp=>!wantedIds.has(Number(tp.person_id)));
  if(removedPeople.length){
    const removedIds=[...new Set(removedPeople.map(tp=>Number(tp.person_id)).filter(Number.isFinite))];
    if(tripItemIds.length&&removedIds.length) await api("bloomtrip_trip_item_people?trip_item_id=in.("+tripItemIds.join(',')+")&person_id=in.("+removedIds.join(',')+")",{method:"DELETE"}).catch(()=>{});
    await api("bloomtrip_trip_people?trip_id=eq."+t.id+"&person_id=in.("+removedIds.join(',')+")",{method:"DELETE"}).catch(()=>{});
  }
  existing=await api("bloomtrip_trip_people?trip_id=eq."+t.id+"&select=*,person:bloomtrip_people(id,name,kind,emoji)&order=person_id");
  const existingIds=new Set(existing.map(x=>Number(x.person_id)));
  const missing=wanted.filter(p=>!existingIds.has(Number(p.id)));
  if(missing.length) await api("bloomtrip_trip_people",{method:"POST",body:JSON.stringify(missing.map(p=>({trip_id:t.id,person_id:p.id,display_name:p.name})))});
  existing=await api("bloomtrip_trip_people?trip_id=eq."+t.id+"&select=*,person:bloomtrip_people(id,name,kind,emoji)&order=person_id");
  tripPeople=existing.filter(tp=>wantedIds.has(Number(tp.person_id)));
}

async function syncPetLinks(t){if(!isPetTrip(t))return;const tps=await api("bloomtrip_trip_people?trip_id=eq."+t.id+"&select=person_id,person:bloomtrip_people(id,name,kind)");const pets=tps.filter(tp=>tp.person?.kind==="pet");if(!pets.length)return;const tripItems=await api("bloomtrip_trip_items?trip_id=eq."+t.id+"&select=id,general_item_id,categoria");const petItems=tripItems.filter(x=>x.categoria==="Mascota");if(!petItems.length)return;const gids=[...new Set(petItems.map(x=>x.general_item_id).filter(Boolean))];let generals=[];if(gids.length)generals=await api("bloomtrip_general_items?id=in.("+gids.join(",")+")&select=id,pet_targets").catch(()=>[]);const gm=new Map(generals.map(g=>[g.id,g]));const existing=await api("bloomtrip_trip_item_people?select=trip_item_id,person_id").catch(()=>[]);const have=new Set(existing.filter(x=>petItems.some(i=>i.id===x.trip_item_id)).map(x=>x.trip_item_id+":"+x.person_id));const missing=[];for(const item of petItems){const targets=(gm.get(item.general_item_id)?.pet_targets||[]).map(v=>String(v).toLowerCase());for(const tp of pets){let applies=!targets.length;const pname=String(tp.person?.name||"").toLowerCase();const kind=String(tp.person?.kind||"").toLowerCase();if(targets.length){applies=targets.includes(pname)||targets.includes(kind)||(targets.includes("gato")&&targets.includes("perro")&&pname!=="gato"&&pname!=="perro")}if(applies&&!have.has(item.id+":"+tp.person_id))missing.push({trip_item_id:item.id,person_id:tp.person_id,done:false})}}if(missing.length)await postTripItemPeople(missing)}
async function openTrip(t){currentTrip=t;currentPerson=null;await initTripPeople(t);await syncPetLinks(t);$("home").classList.add("hidden");$("general").classList.add("hidden");$("detail").classList.remove("hidden");$("personDetail").classList.add("hidden");$("profiles").classList.remove("hidden");$("tripTitle").textContent=t.name;$("tripMeta").textContent=tripMeta(t);renderProfiles();resolveWeather(t)}
async function renderProfiles(){const all=await api("bloomtrip_trip_items?select=*&trip_id=eq."+currentTrip.id);const links=await api("bloomtrip_trip_item_people?select=trip_item_id,person_id").catch(()=>[]);const generalIds=[...new Set(all.map(x=>x.general_item_id).filter(Boolean))];let generals=[];if(generalIds.length)generals=await api("bloomtrip_general_items?id=in.("+generalIds.join(",")+")&select=id,categoria,pet_targets").catch(()=>[]);const gm=new Map(generals.map(g=>[g.id,g]));$("profiles").innerHTML="";tripPeople.forEach(tp=>{const linked=new Set(links.filter(l=>l.person_id===tp.person_id).map(l=>l.trip_item_id));const count=all.filter(x=>linked.has(x.id)||legacyAppliesToPerson(x,tp,gm.get(x.general_item_id))).length;const p=tp.person||{};const d=document.createElement("div");d.className="profile";d.innerHTML='<div class="avatar">'+esc(p.emoji||"👤")+'</div><b>'+esc(tp.display_name)+'</b><div class="pct">'+count+' artículo'+(count===1?'':'s')+'</div>';d.onclick=()=>openPerson(tp);$("profiles").append(d)})}
async function collectSelectedPets(){
  const ids=[...document.querySelectorAll('[data-pet]:checked')].map(x=>Number(x.value)).filter(Boolean);
  const newNames=[...document.querySelectorAll('[data-newpet]')].map(x=>x.value.trim()).filter(Boolean);
  for(const petName of newNames){
    const created=await api('bloomtrip_people',{method:'POST',body:JSON.stringify({name:petName,kind:'pet',emoji:'🐾',active:true,is_default:false})});
    if(created?.[0]){people.push(created[0]);ids.push(Number(created[0].id));}
  }
  return [...new Set(ids)];
}

async function tripForm(t=null){
  let currentTravelerIds=new Set();
  if(t){const rows=await api("bloomtrip_trip_people?trip_id=eq."+t.id+"&select=person_id,person:bloomtrip_people(id,name,kind,emoji,is_default)").catch(()=>[]);rows.filter(r=>r.person?.kind==="traveler").forEach(r=>{currentTravelerIds.add(Number(r.person_id));if(!people.some(p=>Number(p.id)===Number(r.person_id))&&r.person)people.push(r.person);});rows.filter(r=>r.person?.kind==="pet").forEach(r=>{if(!people.some(p=>Number(p.id)===Number(r.person_id))&&r.person)people.push(r.person);});}

  const travelers=people.filter(p=>p.kind==='traveler'&&(p.is_default!==false||currentTravelerIds.has(Number(p.id))));
  const travelerChecks=travelers.map(p=>'<label><input type="checkbox" value="'+p.id+'" '+(travelerExistingIds.includes(Number(p.id))?"checked":"")+' data-traveler> '+esc(p.emoji||"🧳")+' '+esc(p.name)+'</label>').join("");
  openModal('<h2>'+ (t?"Editar viaje":"Nuevo viaje")+'</h2><div class="formgrid"><div class="field full"><label>Nombre *</label><input id="fName" value="'+esc(t?.name||"")+'"></div><div class="field"><label>Destino</label><input id="fDest" value="'+esc(t?.destination||"")+'"></div><div class="field"><label>Fecha de inicio</label><input id="fStart" type="date" value="'+(t?.start_date||"")+'"></div><div class="field"><label>Fecha de fin</label><input id="fEnd" type="date" value="'+(t?.end_date||"")+'"></div><div class="field"><label>Estación</label><select id="fSeason"><option value="">Sin indicar</option>'+['Primavera','Verano','Otoño','Invierno'].map(x=>'<option '+(t?.season===x?"selected":"")+'>'+x+'</option>').join('')+'</select></div><div class="field full"><label>Condiciones esperadas</label><div class="checks">'+cond+'</div></div><div class="field full"><label>Transporte y módulos</label><div class="checks">'+modChecks+'</div><div class="hint">Los artículos generales asociados a un módulo se incorporarán o retirarán al guardar el viaje.</div></div><div class="field full"><label>👥 Viajeros que viajan</label><div class="checks" id="travelerChooser">'+travelerChecks+'</div><div class="toolbar"><button type="button" id="addTraveler">＋ Añadir viajero</button></div><div id="newTravelers"></div><div class="hint">Puedes viajar solo, en pareja o añadir hijos y otros viajeros.</div></div><div class="field full" id="petChooser" style="display:none"><label>🐾 Mascotas que viajan</label><div class="checks">'+people.filter(p=>p.kind==="pet").map(p=>'<label><input type="checkbox" value="'+p.id+'" data-pet> '+esc(p.emoji||"🐾")+' '+esc(p.name)+'</label>').join("")+'</div><div class="toolbar"><button type="button" id="addPet">＋ Añadir otra mascota</button></div><div id="newPets"></div><div class="hint">Elige qué mascotas viajan. Puedes añadir otra especie, por ejemplo Conejo.</div></div><div class="field full"><label>👥 Nombres de este viaje</label><div id="tripNames" class="formgrid"></div><div class="hint">Puedes cambiar los nombres solo para este viaje.</div></div><div class="field full"><label>Notas</label><textarea id="fNotes">'+esc(t?.notes||"")+'</textarea></div></div><div class="toolbar"><button id="cancel">Cancelar</button><button class="primary" id="save">Guardar</button></div>');
  const syncTravelerNameInputs=async()=>{
    const box=$("tripNames"); if(!box)return; box.innerHTML="";
    const selected=[...document.querySelectorAll('[data-traveler]:checked')].map(c=>Number(c.value));
    const existingRows=t?await api("bloomtrip_trip_people?trip_id=eq."+t.id+"&person_id=in.("+(selected.join(',')||'0')+")&select=person_id,display_name").catch(()=>[]):[];
    const map=new Map(existingRows.map(r=>[Number(r.person_id),r.display_name]));
    selected.forEach(id=>{const p=people.find(x=>Number(x.id)===id);const f=document.createElement('div');f.className='field';f.innerHTML='<label>'+esc(p?.emoji||'🧳')+' '+esc(p?.name||'Viajero')+'</label><input id="name'+id+'" value="'+esc(map.get(id)||p?.name||'Viajero')+'">';box.append(f)});
    [...document.querySelectorAll('[data-newtraveler]')].forEach((el,i)=>{const f=document.createElement('div');f.className='field';f.innerHTML='<label>🧳 Nuevo viajero</label><input data-newtravelername value="'+esc(el.value||'')+'">';box.append(f)});
  };
  if(t){

  for(const item of its){const g=gm.get(item.general_item_id);for(const tp of tps){const pet=tp.person?.kind==='pet';let applies;if((g?.categoria||item.categoria)==='Mascota'){if(!pet)continue;const targets=(g?.pet_targets||[]).map(v=>String(v).toLowerCase());if(!targets.length)applies=true;else {const pname=String(tp.person?.name||'').toLowerCase();const kind=String(tp.person?.kind||'').toLowerCase();applies=targets.includes(pname)||targets.includes(kind)||(targets.includes('gato')&&targets.includes('perro')&&pname!=='gato'&&pname!=='perro');}}else applies=!pet;if(applies&&!have.has(item.id+':'+tp.person_id))missing.push({trip_item_id:item.id,person_id:tp.person_id,done:false});}}
  if(missing.length)await postTripItemPeople(missing);
}

function fmtWeatherRow(r){const icons={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'🌨️',75:'❄️',80:'🌦️',81:'🌧️',82:'🌧️',95:'⛈️',96:'⛈️',99:'⛈️'};return '<div style="padding:6px 0;border-bottom:1px solid var(--line)">'+esc(new Date(r.date+'T00:00:00').toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'}))+' · '+(icons[r.code]||'🌡️')+' '+r.min+'–'+r.max+' °C'+(r.rain!=null?' · 💧 '+r.rain+'%':'')+'</div>'}
function effectiveModuleIds(selected,climates=[]){const ids=new Set(selected.map(Number));const climateNames=new Set(climates.map(x=>String(x).toLowerCase()));modules.filter(m=>climateNames.has(String(m.name||"").toLowerCase())).forEach(m=>ids.add(Number(m.id)));return [...ids]}
async function addGeneralItemsToTrip(tripId,moduleIds,removeStale=true){
  const all=await api("bloomtrip_general_items?active=eq.true&select=*");
  const tripPeopleRows=await api("bloomtrip_trip_people?trip_id=eq."+tripId+"&select=*,person:bloomtrip_people(id,name,kind,emoji)");
  const petTrip=isPetTripByModules(moduleIds);
  const hasPets=tripPeopleRows.some(tp=>tp.person?.kind==="pet");
  const generalIds=all.map(g=>g.id);
  let moduleLinks=[];
  if(generalIds.length)moduleLinks=await api("bloomtrip_general_item_modules?general_item_id=in.("+generalIds.join(",")+")&select=general_item_id,module_id").catch(()=>[]);
  const byGeneral=new Map();
  moduleLinks.forEach(l=>{const a=byGeneral.get(l.general_item_id)||[];a.push(Number(l.module_id));byGeneral.set(l.general_item_id,a)});
  const existing=await api("bloomtrip_trip_items?trip_id=eq."+tripId+"&select=id,general_item_id").catch(()=>[]);
  const existingGeneral=new Set(existing.map(x=>x.general_item_id).filter(Boolean));
  const stale=existing.filter(x=>x.general_item_id).filter(x=>{
    const gi=all.find(g=>g.id===x.general_item_id); if(!gi)return false;
    const glinks=byGeneral.get(gi.id)||[];
    if(gi.categoria==="Mascota"&&(!petTrip||!hasPets))return true;
    if(glinks.length&&!glinks.some(id=>moduleIds.includes(id)))return true;
    return false;
  });
  for(const x of (removeStale?stale:[])){
    await api("bloomtrip_trip_item_people?trip_item_id=eq."+x.id,{method:"DELETE"}).catch(()=>{});
    await api("bloomtrip_trip_items?id=eq."+x.id,{method:"DELETE"}).catch(()=>{});
    existingGeneral.delete(x.general_item_id);
  }
  const chosen=all.filter(gi=>{
    if(existingGeneral.has(gi.id))return false;
    const links=byGeneral.get(gi.id)||[];
    if(links.length&&!links.some(id=>moduleIds.includes(id)))return false;
    if(gi.categoria==="Mascota"&&(!petTrip||!hasPets))return false;
    return true;
  });
  if(!chosen.length)return;
  const now=new Date().toISOString();
  const rows=chosen.map(gi=>({trip_id:tripId,articulo:gi.articulo,categoria:gi.categoria,subcategoria:gi.subcategoria,unidades:gi.unidades,prioridad:gi.prioridad,donde_llevarlo:gi.donde_llevarlo,notas:gi.notas,assignment_mode:"selected",done:false,item_type:gi.item_type,phase:gi.phase,general_item_id:gi.id,updated_at:now}));
  const created=await api("bloomtrip_trip_items",{method:"POST",body:JSON.stringify(rows)});
  const createdByGeneral=new Map((created||[]).map(x=>[x.general_item_id,x]));
  const links=[];
  for(const gi of chosen){
    const item=createdByGeneral.get(gi.id); if(!item)continue;
    const targets=(gi.pet_targets||[]).map(v=>String(v).toLowerCase());
    const targetRows=tripPeopleRows.filter(tp=>{
      const pet=tp.person?.kind==="pet";
      if(gi.categoria==="Mascota"){
        if(!pet)return false;
        if(!targets.length)return true;
        const pname=String(tp.person?.name||"").toLowerCase();
        if(targets.includes(pname)||targets.includes(String(tp.person?.kind||"").toLowerCase()))return true;
        return targets.includes("gato")&&targets.includes("perro")&&pname!=="gato"&&pname!=="perro";
      }
      return !pet;
    });
    targetRows.forEach(tp=>links.push({trip_item_id:item.id,person_id:tp.person_id,done:false}));
  }
  if(links.length)await postTripItemPeople(links);
}

}
async function deleteItem(x){if(!confirm('¿Eliminar "'+x.articulo+'"?'))return;try{await api("bloomtrip_trip_item_people?trip_item_id=eq."+x.id,{method:"DELETE"});await api("bloomtrip_trip_items?id=eq."+x.id,{method:"DELETE"});await renderItems()}catch(e){alert("No se pudo eliminar.")}}
function itemFields(x,allowGeneral){const catOptions=categories.map(c=>'<option '+(x?.categoria===c.name?"selected":"")+'>'+esc(c.name)+'</option>').join("");const locOptions=locations.map(l=>'<option '+(x?.donde_llevarlo===l.name?"selected":"")+'>'+esc(l.name)+'</option>').join("");const pets=x?.pet_targets||[];const linkedModules=x?.module_tags||[];const moduleField=allowGeneral?'<div class="field full"><label>Módulos / situaciones en las que se incluye</label><div class="checks">'+modules.map(m=>'<label><input type="checkbox" value="'+m.id+'" data-itemmod '+(linkedModules.map(Number).includes(Number(m.id))?'checked':'')+'> '+esc(m.emoji||'')+' '+esc(m.name)+'</label>').join('')+'</div><div class="hint">Si no marcas ninguno, se considera un artículo general.</div></div>':'';const petField=allowGeneral?'<div class="field full"><label>Perfil mascota (solo si la categoría es Mascota)</label><select id="iPet"><option value="">Común a Gato y Perro</option><option value="gato" '+(pets.length===1&&pets[0]==="gato"?"selected":"")+'>🐱 Solo Gato</option><option value="perro" '+(pets.length===1&&pets[0]==="perro"?"selected":"")+'>🐶 Solo Perro</option><option value="ambos" '+(pets.length===2?"selected":"")+'>🐱🐶 Gato y Perro</option></select></div>':'';return '<div class="formgrid"><div class="field full"><label>Artículo *</label><input id="iName" value="'+esc(x?.articulo||"")+'"></div><div class="field"><label>Categoría</label><select id="iCat"><option value="">Sin categoría</option>'+catOptions+'</select></div><div class="field"><label>Subcategoría</label><input id="iSub" value="'+esc(x?.subcategoria||"")+'"></div><div class="field"><label>Unidades</label><input id="iUnits" value="'+esc(x?.unidades||"")+'"></div><div class="field"><label>Prioridad</label><select id="iPri"><option value="">Sin prioridad</option>'+['Imprescindible','Importante','Recomendado','Opcional'].map(p=>'<option '+(x?.prioridad===p?"selected":"")+'>'+p+'</option>').join('')+'</select></div><div class="field"><label>Dónde llevarlo</label><select id="iLoc"><option value="">Sin indicar</option>'+locOptions+'</select></div><div class="field"><label>Tipo</label><select id="iType">'+['Artículo físico','Digital','Documento / trámite','Tarea'].map(p=>'<option '+(x?.item_type===p?"selected":"")+'>'+p+'</option>').join('')+'</select></div><div class="field"><label>Fase</label><select id="iPhase"><option value="">Sin fase</option>'+['Previo al viaje','Durante el viaje','Mascota en casa'].map(p=>'<option '+(x?.phase===p?"selected":"")+'>'+p+'</option>').join('')+'</select></div><div class="field full"><label>Notas</label><textarea id="iNotes">'+esc(x?.notas||"")+'</textarea></div>'+moduleField+petField+(allowGeneral?'<div class="field full"><label class="checkrow"><input id="addGeneral" type="checkbox"> Añadir también a la lista general de BloomTrip</label><div class="hint">Si ya existe un artículo con el mismo nombre, te avisaré y no se duplicará.</div></div>':"")+'</div>'}
async function itemForm(x=null,fromGeneral=false){if(fromGeneral&&x){const ml=await api("bloomtrip_general_item_modules?general_item_id=eq."+x.id+"&select=module_id").catch(()=>[]);x={...x,module_tags:ml.map(v=>Number(v.module_id))}}openModal('<h2>'+(x?(fromGeneral?"Editar artículo general":"Editar artículo"):(fromGeneral?"Añadir artículo general":"Añadir artículo"))+'</h2>'+itemFields(x,fromGeneral)+'<div class="toolbar"><button id="cancel">Cancelar</button><button class="primary" id="save">Guardar</button></div>');$("cancel").onclick=closeModal;$("save").onclick=async()=>{try{const articulo=$("iName").value.trim();if(!articulo)throw Error("El artículo es obligatorio.");const body={articulo,categoria:$("iCat").value||null,subcategoria:$("iSub").value.trim()||null,unidades:$("iUnits").value.trim()||null,prioridad:$("iPri").value||null,donde_llevarlo:$("iLoc").value||null,item_type:$("iType").value,phase:$("iPhase").value||"",notas:$("iNotes").value.trim()||null,updated_at:new Date().toISOString()};if(fromGeneral)body.module_tags=[...document.querySelectorAll('[data-itemmod]:checked')].map(x=>x.value);if(fromGeneral)body.pet_targets=body.categoria==="Mascota"?(( $("iPet")?.value||"")==="gato"?["gato"]:( $("iPet")?.value||"")==="perro"?["perro"]:["gato","perro"]):[];if(fromGeneral){let gid=x?.id;if(x)await api("bloomtrip_general_items?id=eq."+x.id,{method:"PATCH",body:JSON.stringify(body)});else {const createdGeneral=await api("bloomtrip_general_items",{method:"POST",body:JSON.stringify(body)});gid=createdGeneral?.[0]?.id}if(gid){await api("bloomtrip_general_item_modules?general_item_id=eq."+gid,{method:"DELETE"});const mids=[...document.querySelectorAll('[data-itemmod]:checked')].map(e=>Number(e.value));if(mids.length)await api("bloomtrip_general_item_modules",{method:"POST",body:JSON.stringify(mids.map(module_id=>({general_item_id:gid,module_id})))})}}else if(x){await api("bloomtrip_trip_items?id=eq."+x.id,{method:"PATCH",body:JSON.stringify(body)})}else{body.trip_id=currentTrip.id;body.assignment_mode="selected";body.done=false;const created=await api("bloomtrip_trip_items",{method:"POST",body:JSON.stringify(body)});if(created?.[0]){await initTripPeople(currentTrip);const targetRows=tripPeople.filter(tp=>body.categoria==="Mascota"?personIsPet(tp):!personIsPet(tp)).map(tp=>({trip_item_id:created[0].id,person_id:tp.person_id,done:false}));if(targetRows.length)await postTripItemPeople(targetRows)}if($("addGeneral")?.checked){const existing=await api("bloomtrip_general_items?active=eq.true&articulo=ilike."+encodeURIComponent(articulo));if(existing.length)alert("Ese artículo ya existe en la lista general. No se ha duplicado.");else await api("bloomtrip_general_items",{method:"POST",body:JSON.stringify(body)})}}closeModal();fromGeneral?renderGeneral():renderItems()}catch(e){alert("No se pudo guardar el artículo.\n\n"+e.message)}}}
async function renderGeneral(){const prevCat=$("gCat").value;const data=await api("bloomtrip_general_items?active=eq.true&order=categoria.asc,articulo.asc");const q=$("gSearch").value.toLowerCase(),c=prevCat,tp=$("gType").value,ph=$("gPhase").value;$("gCat").innerHTML='<option value="">Todas las categorías</option>'+[...new Set(data.map(x=>x.categoria).filter(Boolean))].sort().map(x=>'<option>'+esc(x)+'</option>').join("");if([...new Set(data.map(x=>x.categoria))].includes(prevCat))$("gCat").value=prevCat;const shown=data.filter(x=>(!q||((x.articulo||"")+" "+(x.categoria||"")+" "+(x.notas||"")).toLowerCase().includes(q))&&(!c||x.categoria===c)&&(!tp||x.item_type===tp)&&(!ph||x.phase===ph));$("generalList").innerHTML=shown.length?"":"<div class=\"empty\">No hay artículos con estos filtros.</div>";shown.forEach(x=>{const d=document.createElement("div");d.className="item";d.innerHTML='<div style="flex:1"><div class="name">'+esc(x.articulo)+'</div><div class="meta">'+esc(x.categoria||"")+(x.subcategoria?" · "+esc(x.subcategoria):"")+(x.donde_llevarlo?" · 📍 "+esc(x.donde_llevarlo):"")+(x.phase?" · "+esc(x.phase):"")+'</div>'+(x.notas?'<div class="meta">📝 '+esc(x.notas)+'</div>':"")+'</div><div class="actions"><button data-edit>✏️</button><button class="danger" data-del>🗑️</button></div>';d.querySelector("[data-edit]").onclick=()=>itemForm(x,true);d.querySelector("[data-del]").onclick=async()=>{if(!confirm('¿Eliminar "'+x.articulo+'" de la lista general?'))return;await api("bloomtrip_general_items?id=eq."+x.id,{method:"PATCH",body:JSON.stringify({active:false,updated_at:new Date().toISOString()})});renderGeneral()};$("generalList").append(d)})}
async function editTripPeople(){await initTripPeople(currentTrip);const rows=tripPeople.map(tp=>'<div class="field"><label>'+esc(tp.person?.emoji||"👤")+' '+esc(tp.person?.kind==="pet"?"Mascota":"Viajero")+'</label><input data-tp="'+tp.person_id+'" value="'+esc(tp.display_name)+'"></div>').join('');openModal('<h2>👥 Nombres del viaje</h2><div class="formgrid">'+rows+'</div><div class="hint">Estos nombres solo afectan a este viaje. Los valores predeterminados siguen siendo Viajero 1, Viajero 2, Gato y Perro.</div><div class="toolbar"><button id="cancel">Cancelar</button><button class="primary" id="save">Guardar</button></div>');$("cancel").onclick=closeModal;$("save").onclick=async()=>{for(const el of document.querySelectorAll("[data-tp]")){const n=el.value.trim()||"Viajero";await api("bloomtrip_trip_people?trip_id=eq."+currentTrip.id+"&person_id=eq."+el.dataset.tp,{method:"PATCH",body:JSON.stringify({display_name:n})})}closeModal();await initTripPeople(currentTrip);renderProfiles();if(currentPerson){const np=tripPeople.find(x=>x.person_id===currentPerson.person_id);currentPerson=np;$("personTitle").textContent=(np.person?.emoji||"👤")+" "+np.display_name}}}
$("newTripBtn").onclick=()=>tripForm();$("generalBtn").onclick=async()=>{$("home").classList.add("hidden");$("general").classList.remove("hidden");await renderGeneral()};$("generalBack").onclick=async()=>{$("general").classList.add("hidden");$("home").classList.remove("hidden");await renderTrips()};$("generalAdd").onclick=()=>itemForm(null,true);["gSearch","gCat","gType","gPhase"].forEach(id=>$(id).addEventListener("input",renderGeneral));$("backBtn").onclick=()=>{$("detail").classList.add("hidden");$("home").classList.remove("hidden");currentTrip=null;currentPerson=null;renderTrips()};$("backPeopleBtn").onclick=()=>{$("personDetail").classList.add("hidden");$("profiles").classList.remove("hidden")};$("bottomBackBtn").onclick=()=>{$("personDetail").classList.add("hidden");$("profiles").classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"})};$("editTripBtn").onclick=()=>tripForm(currentTrip);$("peopleBtn").onclick=editTripPeople;$("addItemBtn").onclick=()=>itemForm();["search","cat","priority","status"].forEach(id=>$(id).addEventListener("input",renderItems));$("undoBtn").onclick=undoLast;
renderTrips().catch(e=>alert("No se pudo conectar con BloomTrip.\n\n"+e.message));
</script></body></html>
