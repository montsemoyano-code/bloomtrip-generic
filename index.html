<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f2ff">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="48x48" href="./favicon-48.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>BloomTrip</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--text:#25232a;--muted:#77727d;--line:#e8e2e9;--accent:#7b61a8;--danger:#b94b4b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:980px;margin:auto;padding:20px 16px 50px}h1{margin:0;font-size:30px}.sub{color:var(--muted);margin:4px 0 18px}
button,input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff;color:var(--text)}
button{cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.danger{color:var(--danger);border-color:#e7caca}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar button{white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.trips{display:grid;gap:8px}.trip{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px}.trip-main{min-width:0}.trip-name{font-weight:700}.trip-meta{font-size:13px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:6px;flex-wrap:wrap}
.profiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.profile{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px;text-align:center;cursor:pointer}.avatar{font-size:38px}.profile b{display:block;margin-top:5px}.pct{color:var(--muted);font-size:13px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}.stat small{display:block;color:var(--muted)}.stat b{font-size:20px}
.progress{height:10px;background:#e9e5ea;border-radius:99px;overflow:hidden;margin:10px 0 18px}.bar{height:100%;background:var(--accent);width:0}
.filters{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:8px;margin:12px 0}
.item{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.item input{margin-top:3px;width:20px;height:20px}.name{font-weight:650}.done .name{text-decoration:line-through;color:#999}.meta{font-size:12px;color:var(--muted);margin-top:3px}.tag{display:inline-block;background:#f0edf2;border-radius:99px;padding:3px 7px;margin:4px 4px 0 0;font-size:11px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal.open{display:flex}.dialog{background:var(--card);border-radius:18px;padding:18px;max-width:650px;width:100%;max-height:90vh;overflow:auto}.dialog h2{margin-top:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:650;color:var(--muted)}textarea{min-height:90px}.checkrow{display:flex;gap:8px;align-items:center;margin:8px 0}.triptypes{display:flex;gap:8px;flex-wrap:wrap}.typecheck{display:flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:9px 10px;background:#fff;cursor:pointer}.typecheck input{width:18px;height:18px;padding:0}.personchecks{display:flex;gap:8px;flex-wrap:wrap}.personchecks label{border:1px solid var(--line);border-radius:10px;padding:8px}.empty{padding:24px;text-align:center;color:var(--muted)}
.hidden{display:none!important}
@media(max-width:700px){.profiles{grid-template-columns:repeat(2,1fr)}.summary{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.trip{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
<h1>BloomTrip</h1>
<div class="sub" id="subtitle">Tu checklist de viajes</div>

<section id="home">
<div class="toolbar">
<button class="primary" id="newTripBtn">✈️ Nuevo viaje</button><button id="generalBtn">📚 Lista general</button>

</div>
<div class="card"><h2>Mis viajes</h2><div class="sub">Cada viaje nuevo empieza automáticamente con la checklist base de BloomTrip.</div><div id="trips" class="trips"></div></div>
</section>

<section id="general" class="hidden">
<div class="toolbar"><button id="generalBack">← Mis viajes</button><button id="generalAdd" class="primary">＋ Añadir artículo general</button></div>
<h2>📚 Lista general de BloomTrip</h2><div class="sub">Los artículos de aquí se incorporan automáticamente a los futuros viajes.</div>
<div class="filters"><input id="generalSearch" placeholder="🔎 Buscar..."><select id="generalCat"><option value="">Todas las categorías</option></select></div><div id="generalList"></div>
</section>

<section id="detail" class="hidden">
<div class="toolbar">
<button id="backBtn">← Mis viajes</button>
<button id="editTripBtn">✏️ Editar viaje</button>
<button id="addItemBtn" class="primary">＋ Añadir artículo</button>
</div>
<h2 id="tripTitle"></h2><div class="sub" id="tripMeta"></div>
<div id="profiles" class="profiles"></div>
<div id="personDetail" class="hidden">
<div class="toolbar"><button id="backPeopleBtn">← Viajeros</button></div>
<h2 id="personTitle"></h2>
<div class="summary"><div class="stat"><small>Total</small><b id="total">0</b></div><div class="stat"><small>Preparado</small><b id="done">0</b></div><div class="stat"><small>Pendiente</small><b id="pending">0</b></div><div class="stat"><small>Progreso</small><b id="pct">0%</b></div></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="filters"><input id="search" placeholder="🔎 Buscar..."><select id="cat"></select><select id="priority"></select><select id="status"><option value="">Todos</option><option value="pending">Pendientes</option><option value="done">Completados</option></select></div>
<div class="toolbar"><button id="undoBtn" disabled>↶ Deshacer</button></div>
<div id="list"></div>
<div class="toolbar"><button id="bottomBackBtn">← Volver</button></div>
</div>
</section>
</div>

<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>

<script>
const SUPABASE_URL="https://aklffkhjvsruxrqvbbqg.supabase.co";
const SUPABASE_KEY="sb_publishable_eukhXd1rFXuuRBrkfmAVmA_HujBVLOG";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
let people=[],trips=[],items=[],categories=[],locations=[],tripTypes=[],currentTrip=null,currentPerson=null,undoStack=[];
let itemFilter={search:"",cat:"",priority:"",status:""};

async function api(path,opts={}){
 const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...opts,headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",Prefer:opts.method==="POST"?"return=representation":"return=minimal",...(opts.headers||{})}});
 if(!r.ok) throw new Error(await r.text()); return r.status===204?null:r.json();
}
function openModal(html){$("dialog").innerHTML=html;$("modal").classList.add("open")}
function closeModal(){$("modal").classList.remove("open")}
$("modal").onclick=e=>{if(e.target===$("modal"))closeModal()}

async function loadBase(){
 [people,categories,locations,trips,tripTypes]=await Promise.all([
  api("bloomtrip_people?select=*&active=eq.true&order=sort_order,id"),
  api("bloomtrip_categories?select=*&active=eq.true&order=sort_order,name"),
  api("bloomtrip_locations?select=*&active=eq.true&order=sort_order,name"),
  api("bloomtrip_trips?select=*&status=eq.active&is_template=eq.false&order=created_at.desc"),
  api("bloomtrip_trip_types?select=*&active=eq.true&order=sort_order,name")
 ]);
 const settings=await api("bloomtrip_settings?select=key,value");
 const s=Object.fromEntries(settings.map(x=>[x.key,x.value]));$("subtitle").textContent=s.app_subtitle||"Tu checklist de viajes";
}
function fmtDate(v){if(!v)return"";return new Date(v+"T00:00:00").toLocaleDateString("es-ES")}
function tripMeta(t){return [t.destination,fmtDate(t.start_date)+(t.end_date?" – "+fmtDate(t.end_date):"")].filter(Boolean).join(" · ")}
async function getTripTypeLinks(id){const links=await api("bloomtrip_trip_type_links?select=trip_type_id&trip_id=eq."+id);const ids=new Set(links.map(x=>x.trip_type_id));return tripTypes.filter(x=>ids.has(x.id))}
async function renderTrips(){
 await loadBase(); const box=$("trips");box.innerHTML="";
 if(!trips.length){box.innerHTML='<div class="empty">Todavía no hay viajes. Crea el primero.</div>';return}
 trips.forEach(t=>{const d=document.createElement("div");d.className="trip";d.innerHTML='<div class="trip-main"><div class="trip-name">'+esc(t.name)+'</div><div class="trip-meta">'+esc(tripMeta(t))+'</div></div><div class="actions"><button data-open>Abrir</button><button data-edit>✏️</button><button class="danger" data-del>🗑️</button></div>';
 d.querySelector("[data-open]").onclick=()=>openTrip(t);d.querySelector("[data-edit]").onclick=()=>tripForm(t);d.querySelector("[data-del]").onclick=()=>deleteTrip(t);box.append(d)});
}
async function openTrip(t){currentTrip=t;currentPerson=null;$("home").classList.add("hidden");$("detail").classList.remove("hidden");$("personDetail").classList.add("hidden");$("profiles").classList.remove("hidden");$("tripTitle").textContent=t.name;$("tripMeta").textContent=tripMeta(t);renderProfiles()}
async function renderProfiles(){
  await loadTripPeople();
  const data=await api("bloomtrip_trip_items?select=id,assignment_mode,done,trip_id&trip_id=eq."+currentTrip.id);
  $("profiles").innerHTML="";
  tripPeople.forEach(tp=>{
    const p=people.find(x=>x.id===tp.person_id)||{};
    const d=document.createElement("div");d.className="profile";
    d.innerHTML='<div class="avatar">'+esc(p.emoji||"👤")+'</div><b>'+esc(tp.display_name||p.name||"")+'</b><div class="pct">Abrir checklist</div>';
    d.onclick=()=>openPerson({...p,id:tp.person_id,name:tp.display_name||p.name});
    $("profiles").append(d);
  });
}
async function tripForm(t=null){
 const selected=t?await api("bloomtrip_trip_type_links?select=trip_type_id&trip_id=eq."+t.id):[];
 const selectedIds=new Set(selected.map(x=>x.trip_type_id));
 const checks=tripTypes.map(x=>'<label class="typecheck"><input type="checkbox" value="'+x.id+'" data-trip-type '+(selectedIds.has(x.id)?"checked":"")+'><span>'+esc(x.emoji||"🏷️")+' '+esc(x.name)+'</span></label>').join("");
 openModal('<h2>'+(t?"Editar viaje":"Nuevo viaje")+'</h2><div class="formgrid"><div class="field full"><label>Nombre *</label><input id="fName" value="'+esc(t?.name||"")+'"></div><div class="field"><label>Destino</label><input id="fDest" value="'+esc(t?.destination||"")+'"></div><div class="field"><label>Fecha de inicio</label><input id="fStart" type="date" value="'+(t?.start_date||"")+'"></div><div class="field"><label>Fecha de fin</label><input id="fEnd" type="date" value="'+(t?.end_date||"")+'"></div><div class="field full"><label>Tipo de viaje (puedes elegir varios)</label><div class="triptypes">'+checks+'</div></div></div><div class="toolbar"><button id="cancel">Cancelar</button><button class="primary" id="save">Guardar</button></div>');
 $("cancel").onclick=closeModal;
 $("save").onclick=async()=>{try{const name=$("fName").value.trim();if(!name)throw Error("El nombre es obligatorio.");const body={name,destination:$("fDest").value.trim()||null,start_date:$("fStart").value||null,end_date:$("fEnd").value||null,updated_at:new Date().toISOString()};let id=t?.id;if(t)await api("bloomtrip_trips?id=eq."+id,{method:"PATCH",body:JSON.stringify(body)});else {id=(await api("bloomtrip_trips",{method:"POST",body:JSON.stringify({...body,is_template:false})}))[0].id;
 const templates=await api("bloomtrip_trips?select=id&is_template=eq.true&status=eq.active&limit=1");
 if(templates.length){
  const base=await api("bloomtrip_trip_items?select=*&trip_id=eq."+templates[0].id);
  if(base.length){
   const copies=base.map(x=>({trip_id:id,articulo:x.articulo,categoria:x.categoria,subcategoria:x.subcategoria,unidades:x.unidades,prioridad:x.prioridad,donde_llevarlo:x.donde_llevarlo,notas:x.notas,assignment_mode:x.assignment_mode,done:false}));
   const created=await api("bloomtrip_trip_items",{method:"POST",body:JSON.stringify(copies)});
   const baseLinks=await api("bloomtrip_trip_item_people?select=trip_item_id,person_id&trip_item_id=in.("+base.map(x=>x.id).join(",")+")");
   const byBase=new Map(created.map((x,i)=>[base[i].id,x.id]));
   const links=baseLinks.map(x=>({trip_item_id:byBase.get(x.trip_item_id),person_id:x.person_id,done:false})).filter(x=>x.trip_item_id);
   if(links.length) await api("bloomtrip_trip_item_people",{method:"POST",body:JSON.stringify(links)});
  }
 }
}
await api("bloomtrip_trip_type_links?trip_id=eq."+id,{method:"DELETE"});const ids=[...document.querySelectorAll("[data-trip-type]:checked")].map(c=>Number(c.value));if(ids.length)await api("bloomtrip_trip_type_links",{method:"POST",body:JSON.stringify(ids.map(trip_type_id=>({trip_id:id,trip_type_id})))});closeModal();await renderTrips()}catch(e){alert("No se pudo guardar el viaje.\\n"+e.message)}}
}
async function deleteTrip(t){if(!confirm('¿Eliminar el viaje "'+t.name+'"?'))return;try{await api("bloomtrip_trip_items?trip_id=eq."+t.id,{method:"DELETE"});await api("bloomtrip_trips?id=eq."+t.id,{method:"DELETE"});await renderTrips()}catch(e){alert("No se pudo eliminar el viaje.")}}
async function openPerson(p){currentPerson=p;itemFilter={search:"",cat:"",priority:"",status:""};$("profiles").classList.add("hidden");$("personDetail").classList.remove("hidden");$("personTitle").textContent=(p.emoji||"👤")+" "+p.name;undoStack=[];await renderItems()}
async function renderItemsLegacy(){
 items=await api("bloomtrip_trip_items?select=*&trip_id=eq."+currentTrip.id);
 const links=await api("bloomtrip_trip_item_people?select=*&person_id=eq."+currentPerson.id);
 const linkMap=new Map(links.map(x=>[x.trip_item_id,x]));
 const relevant=items.filter(x=>x.assignment_mode==="all"||linkMap.has(x.id)).map(x=>({...x,personDone:x.assignment_mode==="all"?x.done:!!linkMap.get(x.id)?.done}));
 const t=relevant.length,d=relevant.filter(x=>x.personDone).length,pc=t?Math.round(d/t*100):0;
 $("total").textContent=t;$("done").textContent=d;$("pending").textContent=t-d;$("pct").textContent=pc+"%";$("bar").style.width=pc+"%";
 const cats=[...new Set(relevant.map(x=>x.categoria).filter(Boolean))].sort(),pris=[...new Set(relevant.map(x=>x.prioridad).filter(Boolean))].sort();
 $("cat").innerHTML='<option value="">Todas las categorías</option>'+cats.map(x=>'<option>'+esc(x)+'</option>').join("");
 $("priority").innerHTML='<option value="">Todas las prioridades</option>'+pris.map(x=>'<option>'+esc(x)+'</option>').join("");
 const q=$("search").value.toLowerCase(),c=$("cat").value,pr=$("priority").value,st=$("status").value;
 const shown=relevant.filter(x=>(!q||((x.articulo||"")+" "+(x.categoria||"")+" "+(x.subcategoria||"")+" "+(x.notas||"")).toLowerCase().includes(q))&&(!c||x.categoria===c)&&(!pr||x.prioridad===pr)&&(!st||(st==="done")===x.personDone)).sort((a,b)=>Number(a.personDone)-Number(b.personDone));
 $("list").innerHTML=shown.length?"":"<div class=\"empty\">No hay artículos con estos filtros.</div>";
 shown.forEach(x=>{const row=document.createElement("div");row.className="item"+(x.personDone?" done":"");row.innerHTML='<input type="checkbox" '+(x.personDone?"checked":"")+'><div><div class="name">'+esc(x.articulo)+'</div><div class="meta">'+esc(x.categoria||"")+(x.subcategoria?" · "+esc(x.subcategoria):"")+(x.unidades?" · "+esc(x.unidades)+" ud.":"")+(x.donde_llevarlo?" · 📍 "+esc(x.donde_llevarlo):"")+'</div>'+(x.prioridad?'<span class="tag">'+esc(x.prioridad)+'</span>':"")+(x.notas?'<div class="meta">📝 '+esc(x.notas)+'</div>':"")+'</div><div class="actions"><button data-edit>✏️</button><button class="danger" data-del>🗑️</button></div>';
 row.querySelector("input").onchange=e=>toggleDone(x,e.target.checked);row.querySelector("[data-edit]").onclick=()=>itemForm(x);row.querySelector("[data-del]").onclick=()=>deleteItem(x);$("list").append(row)})
 $("undoBtn").disabled=!undoStack.length;
}
async function toggleDone(x,val){undoStack.push({id:x.id,person:currentPerson.id,old:x.personDone,new:val,mode:x.assignment_mode});$("undoBtn").disabled=false;try{if(x.assignment_mode==="all")await api("bloomtrip_trip_items?id=eq."+x.id,{method:"PATCH",body:JSON.stringify({done:val,updated_at:new Date().toISOString()})});else await api("bloomtrip_trip_item_people?trip_item_id=eq."+x.id+"&person_id=eq."+currentPerson.id,{method:"PATCH",body:JSON.stringify({done:val})});await renderItems()}catch(e){alert("No se pudo guardar.")}}
$("undoBtn").onclick=async()=>{const u=undoStack.pop();if(!u)return;try{if(u.mode==="all")await api("bloomtrip_trip_items?id=eq."+u.id,{method:"PATCH",body:JSON.stringify({done:u.old,updated_at:new Date().toISOString()})});else await api("bloomtrip_trip_item_people?trip_item_id=eq."+u.id+"&person_id=eq."+u.person,{method:"PATCH",body:JSON.stringify({done:u.old})});await renderItems()}catch(e){alert("No se pudo deshacer.")}}
function itemForm(x=null){
 const catOptions=categories.map(c=>'<option '+(x?.categoria===c.name?"selected":"")+'>'+esc(c.name)+'</option>').join("");
 const locOptions=locations.map(l=>'<option '+(x?.donde_llevarlo===l.name?"selected":"")+'>'+esc(l.name)+'</option>').join("");
 const pchecks=people.map(p=>'<label><input type="checkbox" value="'+p.id+'" '+(x&&x.assignment_mode==="selected"?"":"checked")+' data-person>'+esc(p.emoji||"👤")+" "+esc(p.name)+'</label>').join("");
 openModal('<h2>'+(x?"Editar artículo":"Añadir artículo")+'</h2><div class="formgrid"><div class="field full"><label>Artículo *</label><input id="iName" value="'+esc(x?.articulo||"")+'"></div><div class="field"><label>Categoría</label><select id="iCat"><option value="">Sin categoría</option>'+catOptions+'</select></div><div class="field"><label>Subcategoría</label><input id="iSub" value="'+esc(x?.subcategoria||"")+'"></div><div class="field"><label>Unidades</label><input id="iUnits" value="'+esc(x?.unidades||"")+'"></div><div class="field"><label>Prioridad</label><select id="iPri"><option value="">Sin prioridad</option><option '+(x?.prioridad==="Imprescindible"?"selected":"")+'>Imprescindible</option><option '+(x?.prioridad==="Importante"?"selected":"")+'>Importante</option><option '+(x?.prioridad==="Opcional"?"selected":"")+'>Opcional</option></select></div><div class="field"><label>Dónde llevarlo</label><select id="iLoc"><option value="">Sin indicar</option>'+locOptions+'</select></div><div class="field full"><label>Notas</label><textarea id="iNotes">'+esc(x?.notas||"")+'</textarea></div><div class="field full"><label><input id="addGeneral" type="checkbox"> Añadir también a la lista general de BloomTrip</label></div><div class="field full"><label>Asignar a</label><div class="personchecks">'+pchecks+'</div><div class="checkrow"><input id="allPeople" type="checkbox" '+(!x||x.assignment_mode==="all"?"checked":"")+'><label for="allPeople">Todos</label></div></div></div><div class="toolbar"><button id="cancel">Cancelar</button><button class="primary" id="save">Guardar</button></div>');
 $("allPeople").onchange=e=>document.querySelectorAll("[data-person]").forEach(c=>c.checked=e.target.checked);
 $("cancel").onclick=closeModal;$("save").onclick=async()=>{try{const articulo=$("iName").value.trim();if(!articulo)throw Error("El artículo es obligatorio.");const all=$("allPeople").checked;const body={trip_id:currentTrip.id,articulo,categoria:$("iCat").value||null,subcategoria:$("iSub").value.trim()||null,unidades:$("iUnits").value.trim()||null,prioridad:$("iPri").value||null,donde_llevarlo:$("iLoc").value||null,notas:$("iNotes").value.trim()||null,assignment_mode:all?"all":"selected",done:x?.done||false,updated_at:new Date().toISOString()};let id=x?.id;if(x)await api("bloomtrip_trip_items?id=eq."+x.id,{method:"PATCH",body:JSON.stringify(body)});else{id=(await api("bloomtrip_trip_items",{method:"POST",body:JSON.stringify(body)}))[0].id}
 if(!all){await api("bloomtrip_trip_item_people?trip_item_id=eq."+id,{method:"DELETE"});const ids=[...document.querySelectorAll("[data-person]:checked")].map(c=>Number(c.value));if(ids.length)await api("bloomtrip_trip_item_people",{method:"POST",body:JSON.stringify(ids.map(person_id=>({trip_item_id:id,person_id})))});}
 if($("addGeneral")?.checked && !x){
 const templates=await api("bloomtrip_trips?select=id&is_template=eq.true&status=eq.active&limit=1");
 if(templates.length){
  const exists=await api("bloomtrip_trip_items?select=id&trip_id=eq."+templates[0].id+"&articulo=eq."+encodeURIComponent(articulo)+"&limit=1");
  if(exists.length) alert("Ese artículo ya está en la lista general. Se ha añadido al viaje, pero no se ha duplicado.");
  else await api("bloomtrip_trip_items",{method:"POST",body:JSON.stringify({...body,trip_id:templates[0].id,assignment_mode:"all",done:false})});
 }
}
closeModal();await renderItems()}catch(e){alert("No se pudo guardar el artículo.\\n"+e.message)}}
}
async function deleteItem(x){if(!confirm('¿Eliminar "'+x.articulo+'"?'))return;try{await api("bloomtrip_trip_item_people?trip_item_id=eq."+x.id,{method:"DELETE"});await api("bloomtrip_trip_items?id=eq."+x.id,{method:"DELETE"});await renderItems()}catch(e){alert("No se pudo eliminar.")}}

async function openGeneral(){ $("home").classList.add("hidden");$("detail").classList.add("hidden");$("general").classList.remove("hidden");await renderGeneral() }
async function renderGeneral(){
 const t=await api("bloomtrip_trips?select=id&is_template=eq.true&status=eq.active&limit=1");

<script>
/* BloomTrip v5: Lista general real + viajeros por viaje */
let tripPeople=[];
async function loadTripPeople(){
  tripPeople=await api("bloomtrip_trip_people?select=trip_id,person_id,display_name&trip_id=eq."+currentTrip.id);
  if(!tripPeople.length && people.length){
    tripPeople=await api("bloomtrip_trip_people",{method:"POST",body:JSON.stringify(people.map(p=>({trip_id:currentTrip.id,person_id:p.id,display_name:p.name})))});
  }
}
async function openTrip(t){
  currentTrip=t; currentPerson=null; await loadTripPeople();

  $("tripTitle").textContent=t.name;$("tripMeta").textContent=tripMeta(t);await renderProfiles();
}
async function renderProfiles(){
  const data=await api("bloomtrip_trip_items?select=id&trip_id=eq."+currentTrip.id);
  $("profiles").innerHTML="";
  tripPeople.forEach(tp=>{
    const p=people.find(x=>x.id===tp.person_id)||{};
    const d=document.createElement("div");d.className="profile";
    d.innerHTML='<div class="avatar">'+esc(p.emoji||"👤")+'</div><b>'+esc(tp.display_name||p.name||"Viajero")+'</b><div class="pct">'+data.length+' artículos · Abrir checklist</div>';
    d.onclick=()=>openPerson({...p,id:tp.person_id,name:tp.display_name||p.name});$("profiles").append(d);
  });
}
function tripPeopleForm(){
  const rows=tripPeople.map(tp=>{const p=people.find(x=>x.id===tp.person_id)||{};return '<div class="field"><label>'+esc(p.emoji||"👤")+' '+esc(p.kind==="pet"?"Mascota":"Viajero")+'</label><input data-tp="'+tp.person_id+'" value="'+esc(tp.display_name||p.name||"")+'"></div>'}).join("");
  openModal('<h2>Viajeros y mascotas de este viaje</h2><div class="sub">Los nombres solo cambian en este viaje. No modifican los valores por defecto de BloomTrip.</div><div class="formgrid">'+rows+'</div><div class="toolbar"><button id="cancel">Cancelar</button><button class="primary" id="save">Guardar</button></div>');
  $("cancel").onclick=closeModal;$('save').onclick=async()=>{try{for(const input of document.querySelectorAll('[data-tp]')){const name=input.value.trim();if(!name)throw Error('Todos los nombres deben estar completos.');await api("bloomtrip_trip_people?trip_id=eq."+currentTrip.id+"&person_id=eq."+input.dataset.tp,{method:"PATCH",body:JSON.stringify({display_name:name})})}await loadTripPeople();closeModal();await renderProfiles();if(currentPerson){const tp=tripPeople.find(x=>x.person_id===currentPerson.id);if(tp){currentPerson.name=tp.display_name;$("personTitle").textContent=(currentPerson.emoji||"👤")+" "+tp.display_name}}}catch(e){alert('No se pudieron guardar los nombres.\n'+e.message)}};

async function tripForm(t=null){
  const selected=t?await api("bloomtrip_trip_type_links?select=trip_type_id&trip_id=eq."+t.id):[];

    else{
      id=(await api("bloomtrip_trips",{method:"POST",body:JSON.stringify({...body,is_template:false})}))[0].id;
      const defaults=await api("bloomtrip_people?select=id,name&active=eq.true&order=sort_order,id");
      if(defaults.length)await api("bloomtrip_trip_people",{method:"POST",body:JSON.stringify(defaults.map(p=>({trip_id:id,person_id:p.id,display_name:p.name})))});
      const base=await api("bloomtrip_general_items?select=*&active=eq.true&order=categoria,articulo");

    closeModal();await renderTrips();
  }catch(e){alert('No se pudo guardar el viaje.\n'+e.message)}};
}

  const base=await api("bloomtrip_general_items?select=*&active=eq.true&order=categoria,articulo");

  $("generalCat").innerHTML='<option value="">Todas las categorías</option>'+cats.map(x=>'<option '+(x===cat?'selected':'')+'>'+esc(x)+'</option>').join("");

<script>
/* BloomTrip v6: filtros estables + checklist contextual */
async function renderItems(){
  items=await api("bloomtrip_trip_items?select=*&trip_id=eq."+currentTrip.id);
  const links=await api("bloomtrip_trip_item_people?select=*&person_id=eq."+currentPerson.id);
  const linkMap=new Map(links.map(x=>[x.trip_item_id,x]));
  const relevant=items.filter(x=>x.assignment_mode==="all"||linkMap.has(x.id)).filter(x=>currentPerson?.kind==="pet" ? x.categoria==="Mascota" : x.categoria!=="Mascota").map(x=>({...x,personDone:x.assignment_mode==="all"?!!x.done:!!linkMap.get(x.id)?.done}));
  const norm=v=>String(v??"").trim();
  const cats=[...new Set(relevant.map(x=>norm(x.categoria)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es"));
  const pris=[...new Set(relevant.map(x=>norm(x.prioridad)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es"));
  const catEl=$("cat"),priEl=$("priority"),stEl=$("status"),searchEl=$("search");
  const savedCat=norm(itemFilter.cat),savedPri=norm(itemFilter.priority),savedStatus=itemFilter.status||"";
  catEl.innerHTML='<option value="">Todas las categorías</option>'+cats.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join("");
  priEl.innerHTML='<option value="">Todas las prioridades</option>'+pris.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join("");
  catEl.value=savedCat; priEl.value=savedPri; stEl.value=savedStatus; searchEl.value=itemFilter.search||"";
  // Read the actual controls after rebuilding them. This avoids stale state when the DOM is redrawn.
  const q=norm(searchEl.value).toLowerCase(),c=norm(catEl.value),pr=norm(priEl.value),st=stEl.value;
  itemFilter={search:searchEl.value,cat:c,priority:pr,status:st};
  const shown=relevant.filter(x=>{
    const text=((x.articulo||"")+" "+(x.categoria||"")+" "+(x.subcategoria||"")+" "+(x.notas||"")).toLowerCase();
    return (!q||text.includes(q)) && (!c||norm(x.categoria)===c) && (!pr||norm(x.prioridad)===pr) && (!st||(st==="done")===x.personDone);
  }).sort((a,b)=>Number(a.personDone)-Number(b.personDone)||String(a.categoria||"").localeCompare(String(b.categoria||""),"es")||String(a.articulo||"").localeCompare(String(b.articulo||""),"es"));
  const total=relevant.length,done=relevant.filter(x=>x.personDone).length;
  $("total").textContent=total;$("done").textContent=done;$("pending").textContent=total-done;$("pct").textContent=(total?Math.round(done/total*100):0)+"%";$("bar").style.width=(total?Math.round(done/total*100):0)+"%";
  $("list").innerHTML=shown.length?"":"<div class=\"empty\">No hay artículos con estos filtros.</div>";
  shown.forEach(x=>{
    const row=document.createElement("div");row.className="item"+(x.personDone?" done":"");
    row.innerHTML='<input type="checkbox" '+(x.personDone?"checked":"")+'><div><div class="name">'+esc(x.articulo)+'</div><div class="meta">'+esc(x.categoria||"")+(x.subcategoria?" · "+esc(x.subcategoria):"")+(x.unidades?" · "+esc(x.unidades)+" ud.":"")+(x.donde_llevarlo?" · 📍 "+esc(x.donde_llevarlo):"")+'</div>'+(x.prioridad?'<span class="tag">'+esc(x.prioridad)+'</span>':"")+(x.notas?'<div class="meta">📝 '+esc(x.notas)+'</div>':"")+'</div><div class="actions"><button data-edit>✏️</button><button class="danger" data-del>🗑️</button></div>';
    row.querySelector("input").onchange=e=>toggleDone(x,e.target.checked);row.querySelector("[data-edit]").onclick=()=>itemForm(x);row.querySelector("[data-del]").onclick=()=>deleteItem(x);$("list").append(row);
  });
  $("undoBtn").disabled=!undoStack.length;
}

async function tripForm(t=null){
  const selected=t?await api("bloomtrip_trip_type_links?select=trip_type_id&trip_id=eq."+t.id):[];
  const selectedIds=new Set(selected.map(x=>x.trip_type_id));
  const selectedMods=t?await api("bloomtrip_trip_modules?select=module_id&trip_id=eq."+t.id):[];
  const selectedModIds=new Set(selectedMods.map(x=>x.module_id));
  const selectedTripPeople=t?await api("bloomtrip_trip_people?select=person_id&trip_id=eq."+t.id):[];
  const selectedTripPeopleIds=new Set(selectedTripPeople.map(x=>x.person_id));
  const mods=await api("bloomtrip_modules?select=*&active=eq.true&order=module_group,sort_order,name");
  const checks=tripTypes.map(x=>'<label class="typecheck"><input type="checkbox" value="'+x.id+'" data-trip-type '+(selectedIds.has(x.id)?"checked":"")+'><span>'+esc(x.emoji||"🏷️")+' '+esc(x.name)+'</span></label>').join("");
  const groups=[...new Set(mods.map(m=>m.module_group))];
  const modChecks=groups.map(g=>'<div class="field full"><label>'+esc(g)+"</label><div class=\"triptypes\">"+mods.filter(m=>m.module_group===g).map(m=>'<label class="typecheck"><input type="checkbox" value="'+m.id+'" data-trip-module '+(selectedModIds.has(m.id)?"checked":"")+'><span>'+esc(m.emoji||"")+" "+esc(m.name)+'</span></label>').join("")+"</div></div>").join("");
  openModal('<h2>'+(t?"Editar viaje":"Nuevo viaje")+'</h2><div class="formgrid"><div class="field full"><label>Nombre *</label><input id="fName" value="'+esc(t?.name||"")+'"></div><div class="field"><label>Destino</label><input id="fDest" value="'+esc(t?.destination||"")+'"></div><div class="field"><label>Fecha de inicio</label><input id="fStart" type="date" value="'+(t?.start_date||"")+'"></div><div class="field"><label>Fecha de fin</label><input id="fEnd" type="date" value="'+(t?.end_date||"")+'"></div><div class="field full"><label>Tipo de viaje (puedes elegir varios)</label><div class="triptypes">'+checks+'</div></div><div class="field full"><label>¿Quién participa en este viaje?</label><div class="triptypes">'+people.map(p=>'<label class="typecheck"><input type="checkbox" value="'+p.id+'" data-trip-person '+((t?selectedTripPeopleIds.has(p.id):p.kind!=="pet")?"checked":"")+'><span>'+esc(p.emoji||"👤")+' '+esc(p.name)+(p.kind==="pet"?" · mascota":"")+'</span></label>').join("")+'</div></div>'+modChecks+'</div><div class="toolbar"><button id="cancel">Cancelar</button><button class="primary" id="save">Guardar</button></div>');
  $("cancel").onclick=closeModal;
  $("save").onclick=async()=>{
    try{
      const name=$("fName").value.trim();if(!name)throw Error("El nombre es obligatorio.");
      const body={name,destination:$("fDest").value.trim()||null,start_date:$("fStart").value||null,end_date:$("fEnd").value||null,updated_at:new Date().toISOString()};
      let id=t?.id;
      const selectedModuleIds=[...document.querySelectorAll("[data-trip-module]:checked")].map(c=>Number(c.value));
      if(t){
        await api("bloomtrip_trips?id=eq."+id,{method:"PATCH",body:JSON.stringify(body)});
      }else{
        id=(await api("bloomtrip_trips",{method:"POST",body:JSON.stringify({...body,is_template:false})}))[0].id;
        const defaults=await api("bloomtrip_people?select=id,name,kind,emoji&active=eq.true&order=sort_order,id");
        const selectedPeopleIds=[...document.querySelectorAll("[data-trip-person]:checked")].map(c=>Number(c.value));
        const chosenPeople=defaults.filter(p=>selectedPeopleIds.includes(p.id));
        if(chosenPeople.length)await api("bloomtrip_trip_people",{method:"POST",body:JSON.stringify(chosenPeople.map(p=>({trip_id:id,person_id:p.id,display_name:p.name})))});

        /* Checklist inicial: artículos base (sin módulos) + artículos asociados
           a CUALQUIERA de los módulos seleccionados. Los artículos ligados a otro
           módulo no elegido no entran. */
        const base=await api("bloomtrip_general_items?select=*&active=eq.true&order=categoria,articulo");
        const links=await api("bloomtrip_general_item_modules?select=general_item_id,module_id");
        const linksByItem=new Map();
        links.forEach(l=>{if(!linksByItem.has(l.general_item_id))linksByItem.set(l.general_item_id,new Set());linksByItem.get(l.general_item_id).add(l.module_id)});
        const selectedSet=new Set(selectedModuleIds);
        const hasPet=chosenPeople.some(p=>p.kind==="pet");
        const filteredBase=base.filter(x=>{
          // Los artículos de mascota solo se generan si una mascota participa en el viaje.
          if(x.categoria==="Mascota") return hasPet;
          const itemLinks=linksByItem.get(x.id);
          if(!itemLinks||!itemLinks.size)return true;
          return [...itemLinks].some(mid=>selectedSet.has(mid));
        });
        if(filteredBase.length){
          await api("bloomtrip_trip_items",{method:"POST",body:JSON.stringify(filteredBase.map(x=>({trip_id:id,articulo:x.articulo,categoria:x.categoria,subcategoria:x.subcategoria,unidades:x.unidades,prioridad:x.prioridad,donde_llevarlo:x.donde_llevarlo,notas:x.notas,assignment_mode:"all",done:false,general_item_id:x.id,item_type:x.item_type||"Artículo físico",phase:x.phase||""})))})
        }
      }
      await api("bloomtrip_trip_type_links?trip_id=eq."+id,{method:"DELETE"});
      const typeIds=[...document.querySelectorAll("[data-trip-type]:checked")].map(c=>Number(c.value));
      if(typeIds.length)await api("bloomtrip_trip_type_links",{method:"POST",body:JSON.stringify(typeIds.map(trip_type_id=>({trip_id:id,trip_type_id})))});
      await api("bloomtrip_trip_modules?trip_id=eq."+id,{method:"DELETE"});
      if(selectedModuleIds.length)await api("bloomtrip_trip_modules",{method:"POST",body:JSON.stringify(selectedModuleIds.map(module_id=>({trip_id:id,module_id})))});
      const selectedPeopleIds=[...document.querySelectorAll("[data-trip-person]:checked")].map(c=>Number(c.value));
      const currentTP=await api("bloomtrip_trip_people?select=person_id&trip_id=eq."+id);
      if(currentTP.length)await api("bloomtrip_trip_people?trip_id=eq."+id,{method:"DELETE"});
      if(selectedPeopleIds.length){const allPeople=await api("bloomtrip_people?select=id,name&active=eq.true");const chosen=allPeople.filter(p=>selectedPeopleIds.includes(p.id));await api("bloomtrip_trip_people",{method:"POST",body:JSON.stringify(chosen.map(p=>({trip_id:id,person_id:p.id,display_name:p.name})))})}
      closeModal();await renderTrips();
    }catch(e){alert("No se pudo guardar el viaje.\n"+e.message)}
  };
}
</script>
