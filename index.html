<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f2ff"><title>BloomTrip</title><style>
:root{--bg:#faf8f5;--card:#fff;--text:#25232a;--muted:#77727d;--line:#e8e2e9;--accent:#7b61a8;--danger:#b94b4b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1050px;margin:auto;padding:20px 16px 50px}h1{margin:0;font-size:30px}.sub{color:var(--muted);margin:4px 0 18px}button,input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff;color:var(--text)}button{cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.danger{color:var(--danger);border-color:#e7caca}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.trips{display:grid;gap:8px}.trip{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px}.trip-main{min-width:0}.trip-name{font-weight:700}.trip-meta{font-size:13px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:6px;flex-wrap:wrap}.profiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.profile{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px;text-align:center;cursor:pointer}.avatar{font-size:38px}.profile b{display:block;margin-top:5px}.pct{color:var(--muted);font-size:13px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}.stat small{display:block;color:var(--muted)}.stat b{font-size:20px}.progress{height:10px;background:#e9e5ea;border-radius:99px;overflow:hidden;margin:10px 0 18px}.bar{height:100%;background:var(--accent);width:0}.filters{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:8px;margin:12px 0}.item{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.item input{margin-top:3px;width:20px;height:20px}.name{font-weight:650}.done .name{text-decoration:line-through;color:#999}.meta{font-size:12px;color:var(--muted);margin-top:3px}.tag{display:inline-block;background:#f0edf2;border-radius:99px;padding:3px 7px;margin:4px 4px 0 0;font-size:11px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal.open{display:flex}.dialog{background:var(--card);border-radius:18px;padding:18px;max-width:760px;width:100%;max-height:92vh;overflow:auto}.dialog h2{margin-top:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:650;color:var(--muted)}textarea{min-height:90px}.checkrow{display:flex;gap:8px;align-items:center;margin:8px 0}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.checks label{border:1px solid var(--line);border-radius:10px;padding:8px}.empty{padding:24px;text-align:center;color:var(--muted)}.hidden{display:none!important}.section-title{margin:18px 0 8px}.hint{font-size:12px;color:var(--muted)}
@media(max-width:700px){.profiles{grid-template-columns:repeat(2,1fr)}.summary{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.trip{align-items:flex-start;flex-direction:column}.checks{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><h1>BloomTrip</h1><div class="sub" id="subtitle">Tu checklist de viajes</div>
<section id="home"><div class="toolbar"><button class="primary" id="newTripBtn">✈️ Nuevo viaje</button><button id="generalBtn">📚 Lista general</button></div><div class="card"><h2>Mis viajes</h2><div id="trips" class="trips"></div></div></section>
<section id="general" class="hidden"><div class="toolbar"><button id="generalBack">← Mis viajes</button><button class="primary" id="generalAdd">➕ Añadir artículo general</button></div><h2>📚 Lista general de BloomTrip</h2><div class="sub">Los artículos generales se incorporan automáticamente a los nuevos viajes cuando corresponda.</div><div class="filters"><input id="gSearch" placeholder="🔎 Buscar..."><select id="gCat"></select><select id="gType"><option value="">Todos los tipos</option><option>Artículo físico</option><option>Digital</option><option>Documento / trámite</option><option>Tarea</option></select><select id="gPhase"><option value="">Todas las fases</option><option>Previo al viaje</option><option>Durante el viaje</option><option>Mascota en casa</option></select></div><div id="generalList"></div></section>

<script>
const SUPABASE_URL="https://aklffkhjvsruxrqvbbqg.supabase.co",SUPABASE_KEY="sb_publishable_eukhXd1rFXuuRBrkfmAVmA_HujBVLOG";$=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));let people=[],trips=[],items=[],categories=[],locations=[],modules=[],currentTrip=null,currentPerson=null,tripPeople=[],undoStack=[];
async function api(path,opts={}){const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...opts,headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",Prefer:opts.method==="POST"?"return=representation":"return=minimal",...(opts.headers||{})}});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}
function openModal(html){$("dialog").innerHTML=html;$("modal").classList.add("open")}function closeModal(){$("modal").classList.remove("open")}$("modal").onclick=e=>{if(e.target===$("modal"))closeModal()};function fmtDate(v){if(!v)return"";return new Date(v+"T00:00:00").toLocaleDateString("es-ES")}function tripMeta(t){const mods=(t._modules||[]).map(x=>x.name).join(", ");return [t.destination,fmtDate(t.start_date)+(t.end_date?" – "+fmtDate(t.end_date):""),t.season,mods].filter(Boolean).join(" · ")}
async function loadBase(){[people,categories,locations,trips,modules]=await Promise.all([api("bloomtrip_people?select=*&active=eq.true&order=sort_order,id"),api("bloomtrip_categories?select=*&active=eq.true&order=sort_order,name"),api("bloomtrip_locations?select=*&active=eq.true&order=sort_order,name"),api("bloomtrip_trips?select=*&status=eq.active&is_template=eq.false&order=created_at.desc"),api("bloomtrip_modules?select=*&active=eq.true&order=sort_order,name")]);const settings=await api("bloomtrip_settings?select=key,value");const s=Object.fromEntries(settings.map(x=>[x.key,x.value]));$("subtitle").textContent=s.app_subtitle||"Tu checklist de viajes";for(const t of trips){t._modules=await api("bloomtrip_trip_modules?trip_id=eq."+t.id+"&select=module_id").then(async links=>{if(!links.length)return[];const ids=links.map(x=>x.module_id).join(",");return modules.filter(m=>ids.split(",").includes(String(m.id)))}).catch(()=>[])} }
async function renderTrips(){await loadBase();const box=$("trips");box.innerHTML="";if(!trips.length){box.innerHTML='<div class="empty">Todavía no hay viajes. Crea el primero.</div>';return}trips.forEach(t=>{const d=document.createElement("div");d.className="trip";d.innerHTML='<div class="trip-main"><div class="trip-name">'+esc(t.name)+'</div><div class="trip-meta">'+esc(tripMeta(t))+'</div></div><div class="actions"><button data-open>Abrir</button><button data-edit>✏️</button><button class="danger" data-del>🗑️</button></div>';d.querySelector("[data-open]").onclick=()=>openTrip(t);d.querySelector("[data-edit]").onclick=()=>tripForm(t);d.querySelector("[data-del]").onclick=()=>deleteTrip(t);box.append(d)})}
function isPetTrip(t){return (t?._modules||[]).some(m=>(m.name||"").toLowerCase()==="viaje con mascota")}
function personIsPet(tp){return tp?.person?.kind==="pet"}
function legacyAppliesToPerson(x,tp,general){if(x.assignment_mode!=="all")return false;const pet=personIsPet(tp);if((general?.categoria||x.categoria)==="Mascota") {if(!pet)return false;const targets=(general?.pet_targets||[]).map(v=>String(v).toLowerCase());if(!targets.length)return true;return targets.includes(String(tp.person?.kind||tp.person?.name||"").toLowerCase())||targets.includes(String(tp.person?.name||"").toLowerCase())}return !pet}
async function initTripPeople(t,selectedPetIds=null){const petTrip=isPetTrip(t);let existing=await api("bloomtrip_trip_people?trip_id=eq."+t.id+"&select=*,person:bloomtrip_people(id,name,kind,emoji)&order=person_id");const travelers=people.filter(p=>p.kind!=="pet");let ids=selectedPetIds===null?[...new Set(existing.filter(tp=>tp.person?.kind==="pet").map(tp=>tp.person_id))]:selectedPetIds;const wanted=travelers.concat(petTrip?people.filter(p=>p.kind==="pet"&&ids.includes(p.id)):[]);const wantedIds=new Set(wanted.map(p=>p.id));for(const tp of existing.filter(tp=>!wantedIds.has(tp.person_id))){await api("bloomtrip_trip_item_people?trip_id=eq."+t.id+"&person_id=eq."+tp.person_id,{method:"DELETE"}).catch(()=>{});await api("bloomtrip_trip_people?trip_id=eq."+t.id+"&person_id=eq."+tp.person_id,{method:"DELETE"}).catch(()=>{})}existing=await api("bloomtrip_trip_people?trip_id=eq."+t.id+"&select=*,person:bloomtrip_people(id,name,kind,emoji)&order=person_id");const existingIds=new Set(existing.map(x=>x.person_id));const missing=wanted.filter(p=>!existingIds.has(p.id));if(missing.length)await api("bloomtrip_trip_people",{method:"POST",body:JSON.stringify(missing.map(p=>({trip_id:t.id,person_id:p.id,display_name:p.name})))});existing=await api("bloomtrip_trip_people?trip_id=eq."+t.id+"&select=*,person:bloomtrip_people(id,name,kind,emoji)&order=person_id");tripPeople=existing.filter(tp=>wantedIds.has(tp.person_id))}
async function openTrip(t){currentTrip=t;currentPerson=null;await initTripPeople(t);$("home").classList.add("hidden");$("general").classList.add("hidden");$("detail").classList.remove("hidden");$("personDetail").classList.add("hidden");$("profiles").classList.remove("hidden");$("tripTitle").textContent=t.name;$("tripMeta").textContent=tripMeta(t);renderProfiles()}
async function renderProfiles(){const all=await api("bloomtrip_trip_items?select=*&trip_id=eq."+currentTrip.id);const links=await api("bloomtrip_trip_item_people?select=trip_item_id,person_id").catch(()=>[]);const generalIds=[...new Set(all.map(x=>x.general_item_id).filter(Boolean))];let generals=[];if(generalIds.length)generals=await api("bloomtrip_general_items?id=in.("+generalIds.join(",")+")&select=id,categoria,pet_targets").catch(()=>[]);const gm=new Map(generals.map(g=>[g.id,g]));$("profiles").innerHTML="";tripPeople.forEach(tp=>{const linked=new Set(links.filter(l=>l.person_id===tp.person_id).map(l=>l.trip_item_id));const count=all.filter(x=>linked.has(x.id)||legacyAppliesToPerson(x,tp,gm.get(x.general_item_id))).length;const p=tp.person||{};const d=document.createElement("div");d.className="profile";d.innerHTML='<div class="avatar">'+esc(p.emoji||"👤")+'</div><b>'+esc(tp.display_name)+'</b><div class="pct">'+count+' artículo'+(count===1?'':'s')+'</div>';d.onclick=()=>openPerson(tp);$("profiles").append(d)})}
function tripForm(t=null){const chosen=new Set((t?._modules||[]).map(m=>m.id));const petModule=modules.find(m=>(m.name||"").toLowerCase()==="viaje con mascota");const modChecks=modules.map(m=>'<label><input type="checkbox" value="'+m.id+'" '+(chosen.has(m.id)?"checked":"")+' data-mod> '+esc(m.emoji||"")+" "+esc(m.name)+'</label>').join("");const cond=['Calor','Templado','Frío','Lluvia','Nieve/hielo','Variable'].map(x=>'<label><input type="checkbox" value="'+x+'" '+((t?.climate_conditions||[]).includes(x)?"checked":"")+' data-climate> '+x+'</label>').join("");openModal('<h2>'+ (t?"Editar viaje":"Nuevo viaje")+'</h2><div class="formgrid"><div class="field full"><label>Nombre *</label><input id="fName" value="'+esc(t?.name||"")+'"></div><div class="field"><label>Destino</label><input id="fDest" value="'+esc(t?.destination||"")+'"></div><div class="field"><label>Fecha de inicio</label><input id="fStart" type="date" value="'+(t?.start_date||"")+'"></div><div class="field"><label>Fecha de fin</label><input id="fEnd" type="date" value="'+(t?.end_date||"")+'"></div><div class="field"><label>Estación</label><select id="fSeason"><option value="">Sin indicar</option>'+['Primavera','Verano','Otoño','Invierno'].map(x=>'<option '+(t?.season===x?"selected":"")+'>'+x+'</option>').join('')+'</select></div><div class="field full"><label>Condiciones esperadas</label><div class="checks">'+cond+'</div></div><div class="field full"><label>Transporte y módulos</label><div class="checks">'+modChecks+'</div><div class="hint">Los artículos generales asociados a un módulo se incorporarán al crear el viaje.</div></div><div class="field full" id="petChooser" style="display:none"><label>🐾 Mascotas que viajan</label><div class="checks">'+people.filter(p=>p.kind==="pet").map(p=>'<label><input type="checkbox" value="'+p.id+'" data-pet> '+esc(p.emoji||"🐾")+' '+esc(p.name)+'</label>').join("")+'</div><div class="toolbar"><button type="button" id="addPet">＋ Añadir otra mascota</button></div><div id="newPets"></div><div class="hint">Elige qué mascotas viajan. Puedes añadir otra especie, por ejemplo Conejo.</div></div><div class="field full"><label>👥 Nombres de este viaje</label><div id="tripNames" class="formgrid"><div class="field"><label>🧳 Viajero 1</label><input id="name1" value="Viajero 1"></div><div class="field"><label>🧳 Viajero 2</label><input id="name2" value="Viajero 2"></div></div><div class="hint">Puedes cambiar los nombres de viajeros y mascotas solo para este viaje.</div></div><div class="field full"><label>Notas</label><textarea id="fNotes">'+esc(t?.notes||"")+'</textarea></div></div><div class="toolbar"><button id="cancel">Cancelar</button><button class="primary" id="save">Guardar</button></div>');
const refreshPetUI=async()=>{const on=[...document.querySelectorAll("[data-mod]:checked")].some(el=>Number(el.value)===petModule?.id);$("petChooser").style.display=on?"":"none";if(on&&t){const rows=await api("bloomtrip_trip_people?trip_id=eq."+t.id+"&select=person_id,display_name,person:bloomtrip_people(id,name,kind,emoji)&order=person_id").catch(()=>[]);rows.filter(r=>r.person?.kind==="pet").forEach(r=>{const c=document.querySelector('[data-pet][value="'+r.person_id+'"]');if(c)c.checked=true;const f=document.getElementById("petNames");if(!f){const wrap=document.createElement("div");wrap.id="petNames";wrap.className="formgrid";document.getElementById("petChooser").appendChild(wrap)}const row=document.createElement("div");row.className="field petName";row.innerHTML='<label>'+esc(r.person?.emoji||"🐾")+' '+esc(r.person?.name||"Mascota")+'</label><input data-petname="'+r.person_id+'" value="'+esc(r.display_name||r.person?.name||"")+'">';document.getElementById("petNames").appendChild(row)})}};document.querySelectorAll("[data-mod]").forEach(el=>el.addEventListener("change",()=>{refreshPetUI()}));if(t){setTimeout(()=>refreshPetUI(),0)}
$("addPet").onclick=()=>{const d=document.createElement("div");d.className="field newPetRow";d.innerHTML='<label>🐾 Nueva mascota</label><input data-newpet placeholder="Ej.: Conejo, Hurón, Pájaro...">';$("newPets").append(d);d.querySelector("input").focus()};$("cancel").onclick=closeModal;$('save').onclick=async()=>{try{const name=$("fName").value.trim();if(!name)throw Error("El nombre es obligatorio.");if($("fStart").value&&$("fEnd").value&&$("fEnd").value<$("fStart").value)throw Error("La fecha de fin no puede ser anterior a la fecha de inicio.");const selected=[...document.querySelectorAll("[data-mod]:checked")].map(x=>Number(x.value));const climates=[...document.querySelectorAll("[data-climate]:checked")].map(x=>x.value);const body={name,destination:$("fDest").value.trim()||null,start_date:$("fStart").value||null,end_date:$("fEnd").value||null,season:$("fSeason").value||null,climate_conditions:climates,notes:$("fNotes").value.trim()||null,updated_at:new Date().toISOString()};let nt;if(t){await api("bloomtrip_trips?id=eq."+t.id,{method:"PATCH",body:JSON.stringify(body)});await api("bloomtrip_trip_modules?trip_id=eq."+t.id,{method:"DELETE"});if(selected.length)await api("bloomtrip_trip_modules",{method:"POST",body:JSON.stringify(selected.map(module_id=>({trip_id:t.id,module_id})))});nt={...t,...body,_modules:modules.filter(m=>selected.includes(m.id))}}else{body.status="active";body.is_template=false;const created=await api("bloomtrip_trips",{method:"POST",body:JSON.stringify(body)});nt=created?.[0];if(!nt)throw Error("El viaje se creó pero no se pudo recuperar su información.");nt._modules=modules.filter(m=>selected.includes(m.id));if(selected.length)await api("bloomtrip_trip_modules",{method:"POST",body:JSON.stringify(selected.map(module_id=>({trip_id:nt.id,module_id})))});}const petOn=selected.includes(petModule?.id);let petIds=[...document.querySelectorAll("[data-pet]:checked")].map(x=>Number(x.value));for(const el of document.querySelectorAll("[data-newpet]")){const pn=el.value.trim();if(!pn)continue;const createdPet=await api("bloomtrip_people",{method:"POST",body:JSON.stringify({name:pn,kind:"pet",emoji:"🐾",active:true,sort_order:100})});if(createdPet?.[0]){people.push(createdPet[0]);petIds.push(createdPet[0].id)}}await initTripPeople(nt,petOn?petIds:[]);for(const el of document.querySelectorAll("[id^=name]")){const pid=Number(el.id.replace("name",""));if(pid)await api("bloomtrip_trip_people?trip_id=eq."+nt.id+"&person_id=eq."+pid,{method:"PATCH",body:JSON.stringify({display_name:el.value.trim()||"Viajero"})})}for(const el of document.querySelectorAll("[data-petname]")){await api("bloomtrip_trip_people?trip_id=eq."+nt.id+"&person_id=eq."+el.dataset.petname,{method:"PATCH",body:JSON.stringify({display_name:el.value.trim()||"Mascota"})})}if(!t)await cloneGeneralToTrip(nt.id,selected);closeModal();await renderTrips();await openTrip(nt)}catch(e){console.error(e);alert("No se pudo guardar el viaje.\n\n"+e.message)}}}
async function saveTripNames(tripId){const names=[1,2,3,4].map(id=>({person_id:id,display_name:($("name"+id)?.value||["","Viajero 1","Viajero 2","Gato","Perro"][id]).trim()||["","Viajero 1","Viajero 2","Gato","Perro"][id]}));for(const n of names){await api("bloomtrip_trip_people?trip_id=eq."+tripId+"&person_id=eq."+n.person_id,{method:"PATCH",body:JSON.stringify({display_name:n.display_name})})}}
async function cloneGeneralToTrip(tripId,selected){const all=await api("bloomtrip_general_items?active=eq.true&select=*");const tripPeopleRows=await api("bloomtrip_trip_people?trip_id=eq."+tripId+"&select=*,person:bloomtrip_people(id,name,kind,emoji)");const petTrip=tripPeopleRows.some(tp=>tp.person?.kind==="pet");const generalIds=all.map(g=>g.id);let moduleLinks=[];if(generalIds.length)moduleLinks=await api("bloomtrip_general_item_modules?general_item_id=in.("+generalIds.join(",")+")&select=general_item_id,module_id").catch(()=>[]);const byGeneral=new Map();moduleLinks.forEach(l=>{const a=byGeneral.get(l.general_item_id)||[];a.push(Number(l.module_id));byGeneral.set(l.general_item_id,a)});const chosen=all.filter(gi=>{const links=byGeneral.get(gi.id)||[];if(links.length&&!links.some(id=>selected.includes(id)))return false;if(gi.categoria==="Mascota"&&!petTrip)return false;return true});if(!chosen.length)return;const now=new Date().toISOString();const rows=chosen.map(gi=>({trip_id:tripId,articulo:gi.articulo,categoria:gi.categoria,subcategoria:gi.subcategoria,unidades:gi.unidades,prioridad:gi.prioridad,donde_llevarlo:gi.donde_llevarlo,notas:gi.notas,assignment_mode:"selected",done:false,item_type:gi.item_type,phase:gi.phase,general_item_id:gi.id,updated_at:now}));const created=await api("bloomtrip_trip_items",{method:"POST",body:JSON.stringify(rows)});const createdByGeneral=new Map((created||[]).map(x=>[x.general_item_id,x]));const links=[];for(const gi of chosen){const item=createdByGeneral.get(gi.id);if(!item)continue;const targets=(gi.pet_targets||[]).map(v=>String(v).toLowerCase());const targetRows=tripPeopleRows.filter(tp=>{const pet=tp.person?.kind==="pet";if(gi.categoria==="Mascota"){if(!pet)return false;if(!targets.length)return true;const pname=String(tp.person?.name||"").toLowerCase();if(targets.includes(pname)||targets.includes(String(tp.person?.kind||"").toLowerCase()))return true;return targets.includes("gato")&&targets.includes("perro")&&pname!=="gato"&&pname!=="perro"}return !pet});targetRows.forEach(tp=>links.push({trip_item_id:item.id,person_id:tp.person_id,done:false}))}if(links.length)await api("bloomtrip_trip_item_people",{method:"POST",body:JSON.stringify(links)})}
async function deleteTrip(t){if(!confirm('¿Eliminar el viaje "'+t.name+'"?'))return;try{await api("bloomtrip_trips?id=eq."+t.id,{method:"DELETE"});if(currentTrip?.id===t.id)currentTrip=null;await renderTrips()}catch(e){alert("No se pudo eliminar el viaje.\n"+e.message)}}
async function openPerson(tp){currentPerson=tp;$("profiles").classList.add("hidden");$("personDetail").classList.remove("hidden");$("personTitle").textContent=(tp.person?.emoji||"👤")+" "+tp.display_name;undoStack=[];await renderItems()}
async function renderItems(){items=await api("bloomtrip_trip_items?select=*&trip_id=eq."+currentTrip.id);const links=await api("bloomtrip_trip_item_people?select=*");const itemIds=new Set(items.map(x=>x.id));const linkMap=new Map(links.filter(x=>itemIds.has(x.trip_item_id)&&x.person_id===currentPerson.person_id).map(x=>[x.trip_item_id,x]));const generalIds=[...new Set(items.map(x=>x.general_item_id).filter(Boolean))];let generals=[];if(generalIds.length)generals=await api("bloomtrip_general_items?id=in.("+generalIds.join(",")+")&select=id,categoria,pet_targets").catch(()=>[]);const gm=new Map(generals.map(g=>[g.id,g]));const relevant=items.filter(x=>linkMap.has(x.id)||legacyAppliesToPerson(x,currentPerson,gm.get(x.general_item_id))).map(x=>({...x,personDone:x.assignment_mode==="all"?x.done:!!linkMap.get(x.id)?.done}));const t=relevant.length,d=relevant.filter(x=>x.personDone).length,pc=t?Math.round(d/t*100):0;$("total").textContent=t;$("done").textContent=d;$("pending").textContent=t-d;$("pct").textContent=pc+"%";$("bar").style.width=pc+"%";const cats=[...new Set(relevant.map(x=>x.categoria).filter(Boolean))].sort(),pris=[...new Set(relevant.map(x=>x.prioridad).filter(Boolean))].sort();$("cat").innerHTML='<option value="">Todas las categorías</option>'+cats.map(x=>'<option>'+esc(x)+'</option>').join("");$("priority").innerHTML='<option value="">Todas las prioridades</option>'+pris.map(x=>'<option>'+esc(x)+'</option>').join("");const q=$("search").value.toLowerCase(),c=$("cat").value,pr=$("priority").value,st=$("status").value;const shown=relevant.filter(x=>(!q||((x.articulo||"")+" "+(x.categoria||"")+" "+(x.subcategoria||"")+" "+(x.notas||"")).toLowerCase().includes(q))&&(!c||x.categoria===c)&&(!pr||x.prioridad===pr)&&(!st||(st==="done")===x.personDone)).sort((a,b)=>Number(a.personDone)-Number(b.personDone));$("list").innerHTML=shown.length?"":"<div class=\"empty\">No hay artículos con estos filtros.</div>";shown.forEach(x=>{const row=document.createElement("div");row.className="item"+(x.personDone?" done":"");row.innerHTML='<input type="checkbox" '+(x.personDone?"checked":"")+'><div style="flex:1"><div class="name">'+esc(x.articulo)+'</div><div class="meta">'+esc(x.categoria||"")+(x.subcategoria?" · "+esc(x.subcategoria):"")+(x.donde_llevarlo?" · 📍 "+esc(x.donde_llevarlo):"")+(x.phase?" · "+esc(x.phase):"")+'</div>'+(x.prioridad?'<span class="tag">'+esc(x.prioridad)+'</span>':"")+(x.notas?'<div class="meta">📝 '+esc(x.notas)+'</div>':"")+'</div><div class="actions"><button data-edit>✏️</button><button class="danger" data-del>🗑️</button></div>';row.querySelector("input").onchange=e=>toggleDone(x,e.target.checked);row.querySelector("[data-edit]").onclick=()=>itemForm(x,false);row.querySelector("[data-del]").onclick=()=>deleteItem(x);$("list").append(row)});$("undoBtn").disabled=!undoStack.length}
async function toggleDone(x,val){undoStack.push({id:x.id,person:currentPerson.person_id,old:x.personDone,mode:x.assignment_mode});try{if(x.assignment_mode==="all")await api("bloomtrip_trip_items?id=eq."+x.id,{method:"PATCH",body:JSON.stringify({done:val,updated_at:new Date().toISOString()})});else await api("bloomtrip_trip_item_people?trip_item_id=eq."+x.id+"&person_id=eq."+currentPerson.person_id,{method:"PATCH",body:JSON.stringify({done:val})});await renderItems()}catch(e){alert("No se pudo guardar.")}}
async function deleteItem(x){if(!confirm('¿Eliminar "'+x.articulo+'"?'))return;try{await api("bloomtrip_trip_item_people?trip_item_id=eq."+x.id,{method:"DELETE"});await api("bloomtrip_trip_items?id=eq."+x.id,{method:"DELETE"});await renderItems()}catch(e){alert("No se pudo eliminar.")}}
function itemFields(x,allowGeneral){const catOptions=categories.map(c=>'<option '+(x?.categoria===c.name?"selected":"")+'>'+esc(c.name)+'</option>').join("");const locOptions=locations.map(l=>'<option '+(x?.donde_llevarlo===l.name?"selected":"")+'>'+esc(l.name)+'</option>').join("");const pets=x?.pet_targets||[];const petField=allowGeneral?'<div class="field full"><label>Perfil mascota (solo si la categoría es Mascota)</label><select id="iPet"><option value="">Común a Gato y Perro</option><option value="gato" '+(pets.length===1&&pets[0]==="gato"?"selected":"")+'>🐱 Solo Gato</option><option value="perro" '+(pets.length===1&&pets[0]==="perro"?"selected":"")+'>🐶 Solo Perro</option><option value="ambos" '+(pets.length===2?"selected":"")+'>🐱🐶 Gato y Perro</option></select></div>':'';return '<div class="formgrid"><div class="field full"><label>Artículo *</label><input id="iName" value="'+esc(x?.articulo||"")+'"></div><div class="field"><label>Categoría</label><select id="iCat"><option value="">Sin categoría</option>'+catOptions+'</select></div><div class="field"><label>Subcategoría</label><input id="iSub" value="'+esc(x?.subcategoria||"")+'"></div><div class="field"><label>Unidades</label><input id="iUnits" value="'+esc(x?.unidades||"")+'"></div><div class="field"><label>Prioridad</label><select id="iPri"><option value="">Sin prioridad</option>'+['Imprescindible','Importante','Recomendado','Opcional'].map(p=>'<option '+(x?.prioridad===p?"selected":"")+'>'+p+'</option>').join('')+'</select></div><div class="field"><label>Dónde llevarlo</label><select id="iLoc"><option value="">Sin indicar</option>'+locOptions+'</select></div><div class="field"><label>Tipo</label><select id="iType">'+['Artículo físico','Digital','Documento / trámite','Tarea'].map(p=>'<option '+(x?.item_type===p?"selected":"")+'>'+p+'</option>').join('')+'</select></div><div class="field"><label>Fase</label><select id="iPhase"><option value="">Sin fase</option>'+['Previo al viaje','Durante el viaje','Mascota en casa'].map(p=>'<option '+(x?.phase===p?"selected":"")+'>'+p+'</option>').join('')+'</select></div><div class="field full"><label>Notas</label><textarea id="iNotes">'+esc(x?.notas||"")+'</textarea></div>'+petField+(allowGeneral?'<div class="field full"><label class="checkrow"><input id="addGeneral" type="checkbox"> Añadir también a la lista general de BloomTrip</label><div class="hint">Si ya existe un artículo con el mismo nombre, te avisaré y no se duplicará.</div></div>':"")+'</div>'}
function itemForm(x=null,fromGeneral=false){openModal('<h2>'+(x?(fromGeneral?"Editar artículo general":"Editar artículo"):(fromGeneral?"Añadir artículo general":"Añadir artículo"))+'</h2>'+itemFields(x,!x&&!fromGeneral)+'<div class="toolbar"><button id="cancel">Cancelar</button><button class="primary" id="save">Guardar</button></div>');$("cancel").onclick=closeModal;$("save").onclick=async()=>{try{const articulo=$("iName").value.trim();if(!articulo)throw Error("El artículo es obligatorio.");const body={articulo,categoria:$("iCat").value||null,subcategoria:$("iSub").value.trim()||null,unidades:$("iUnits").value.trim()||null,prioridad:$("iPri").value||null,donde_llevarlo:$("iLoc").value||null,item_type:$("iType").value,phase:$("iPhase").value||"",notas:$("iNotes").value.trim()||null,updated_at:new Date().toISOString()};if(fromGeneral)body.pet_targets=body.categoria==="Mascota"?(( $("iPet")?.value||"")==="gato"?["gato"]:( $("iPet")?.value||"")==="perro"?["perro"]:["gato","perro"]):[];if(fromGeneral){if(x)await api("bloomtrip_general_items?id=eq."+x.id,{method:"PATCH",body:JSON.stringify(body)});else await api("bloomtrip_general_items",{method:"POST",body:JSON.stringify(body)})}else if(x){await api("bloomtrip_trip_items?id=eq."+x.id,{method:"PATCH",body:JSON.stringify(body)})}else{body.trip_id=currentTrip.id;body.assignment_mode="selected";body.done=false;const created=await api("bloomtrip_trip_items",{method:"POST",body:JSON.stringify(body)});if(created?.[0]){await initTripPeople(currentTrip);const targetRows=tripPeople.filter(tp=>body.categoria==="Mascota"?personIsPet(tp):!personIsPet(tp)).map(tp=>({trip_item_id:created[0].id,person_id:tp.person_id,done:false}));if(targetRows.length)await api("bloomtrip_trip_item_people",{method:"POST",body:JSON.stringify(targetRows)})}if($("addGeneral")?.checked){const existing=await api("bloomtrip_general_items?active=eq.true&articulo=ilike."+encodeURIComponent(articulo));if(existing.length)alert("Ese artículo ya existe en la lista general. No se ha duplicado.");else await api("bloomtrip_general_items",{method:"POST",body:JSON.stringify(body)})}}closeModal();fromGeneral?renderGeneral():renderItems()}catch(e){alert("No se pudo guardar el artículo.\n\n"+e.message)}}}
async function renderGeneral(){const data=await api("bloomtrip_general_items?active=eq.true&order=categoria.asc,articulo.asc");const q=$("gSearch").value.toLowerCase(),c=$("gCat").value,tp=$("gType").value,ph=$("gPhase").value;const shown=data.filter(x=>(!q||((x.articulo||"")+" "+(x.categoria||"")+" "+(x.notas||"")).toLowerCase().includes(q))&&(!c||x.categoria===c)&&(!tp||x.item_type===tp)&&(!ph||x.phase===ph));$("gCat").innerHTML='<option value="">Todas las categorías</option>'+[...new Set(data.map(x=>x.categoria).filter(Boolean))].sort().map(x=>'<option>'+esc(x)+'</option>').join("");$("generalList").innerHTML=shown.length?"":"<div class=\"empty\">No hay artículos con estos filtros.</div>";shown.forEach(x=>{const d=document.createElement("div");d.className="item";d.innerHTML='<div style="flex:1"><div class="name">'+esc(x.articulo)+'</div><div class="meta">'+esc(x.categoria||"")+(x.subcategoria?" · "+esc(x.subcategoria):"")+(x.donde_llevarlo?" · 📍 "+esc(x.donde_llevarlo):"")+(x.phase?" · "+esc(x.phase):"")+'</div>'+(x.notas?'<div class="meta">📝 '+esc(x.notas)+'</div>':"")+'</div><div class="actions"><button data-edit>✏️</button><button class="danger" data-del>🗑️</button></div>';d.querySelector("[data-edit]").onclick=()=>itemForm(x,true);d.querySelector("[data-del]").onclick=async()=>{if(!confirm('¿Eliminar "'+x.articulo+'" de la lista general?'))return;await api("bloomtrip_general_items?id=eq."+x.id,{method:"PATCH",body:JSON.stringify({active:false,updated_at:new Date().toISOString()})});renderGeneral()};$("generalList").append(d)})}
async function editTripPeople(){await initTripPeople(currentTrip);const rows=tripPeople.map(tp=>'<div class="field"><label>'+esc(tp.person?.emoji||"👤")+' '+esc(tp.person?.kind==="pet"?"Mascota":"Viajero")+'</label><input data-tp="'+tp.person_id+'" value="'+esc(tp.display_name)+'"></div>').join('');openModal('<h2>👥 Nombres del viaje</h2><div class="formgrid">'+rows+'</div><div class="hint">Estos nombres solo afectan a este viaje. Los valores predeterminados siguen siendo Viajero 1, Viajero 2, Gato y Perro.</div><div class="toolbar"><button id="cancel">Cancelar</button><button class="primary" id="save">Guardar</button></div>');$("cancel").onclick=closeModal;$("save").onclick=async()=>{for(const el of document.querySelectorAll("[data-tp]")){const n=el.value.trim()||"Viajero";await api("bloomtrip_trip_people?trip_id=eq."+currentTrip.id+"&person_id=eq."+el.dataset.tp,{method:"PATCH",body:JSON.stringify({display_name:n})})}closeModal();await initTripPeople(currentTrip);renderProfiles();if(currentPerson){const np=tripPeople.find(x=>x.person_id===currentPerson.person_id);currentPerson=np;$("personTitle").textContent=(np.person?.emoji||"👤")+" "+np.display_name}}}
$("newTripBtn").onclick=()=>tripForm();$("generalBtn").onclick=async()=>{$("home").classList.add("hidden");$("general").classList.remove("hidden");await renderGeneral()};$("generalBack").onclick=async()=>{$("general").classList.add("hidden");$("home").classList.remove("hidden");await renderTrips()};$("generalAdd").onclick=()=>itemForm(null,true);["gSearch","gCat","gType","gPhase"].forEach(id=>$(id).addEventListener("input",renderGeneral));$("backBtn").onclick=()=>{$("detail").classList.add("hidden");$("home").classList.remove("hidden");currentTrip=null;currentPerson=null;renderTrips()};$("backPeopleBtn").onclick=()=>{$("personDetail").classList.add("hidden");$("profiles").classList.remove("hidden")};$("bottomBackBtn").onclick=()=>{$("personDetail").classList.add("hidden");$("profiles").classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"})};$("editTripBtn").onclick=()=>tripForm(currentTrip);$("peopleBtn").onclick=editTripPeople;$("addItemBtn").onclick=()=>itemForm();["search","cat","priority","status"].forEach(id=>$(id).addEventListener("input",renderItems));
renderTrips().catch(e=>alert("No se pudo conectar con BloomTrip.\n\n"+e.message));
</script></body></html>
